name: F19B Accessibility RTL Remediation

on:
  push:
    branches:
      - phase/f19b-accessibility-rtl-remediation
  pull_request:
    branches:
      - integration/wave3-reviewed

permissions:
  contents: read

jobs:
  remediation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_SITE_URL: https://lbb.example.test
      VITE_LBB_BACKEND_MODE: prototype
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Accessibility source audit
        run: npm run audit:a11y
      - name: F19-B remediation audit
        run: npm run audit:f19b
      - name: Accessibility regressions
        run: npm run test:a11y
      - name: RTL regressions
        run: npm run test:rtl
      - name: Live checkout accessibility regression
        env:
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run test:f19b-live
