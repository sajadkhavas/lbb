name: F7 scoped validation patch

on:
  push:
    branches:
      - phase/f7-content-editorial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial

      - name: Apply scoped fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_empty_state(path: Path, title: str, replacement: str) -> None:
              text = path.read_text()
              if replacement.strip() in text:
                  return

              marker = f'title="{title}"'
              marker_index = text.index(marker)
              start = text.rfind("<EmptyState", 0, marker_index)
              end = text.index("/>", marker_index) + 2
              if start < 0:
                  raise RuntimeError(f"EmptyState start not found in {path}")

              indentation_start = text.rfind("\n", 0, start) + 1
              indentation = text[indentation_start:start]
              rendered = "\n".join(
                  indentation + line if line else line
                  for line in replacement.strip("\n").splitlines()
              )
              path.write_text(text[:indentation_start] + rendered + text[end:])

          replace_empty_state(
              Path("src/routes/collections.$slug.tsx"),
              "این کالکشن پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute">
    <Layers3 aria-hidden="true" size={34} />
  </span>
  <h1 className="text-display-3 text-bone">این کالکشن پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">
    آدرس کالکشن معتبر نیست یا این صفحه دیگر در فهرست کالکشن‌های LBB قرار ندارد.
  </p>
  <Link to="/collections" className={CtaClasses("signal")}>
    بازگشت به کالکشن‌ها
  </Link>
</div>''',
          )

          journal_path = Path("src/routes/journal.$slug.tsx")
          replace_empty_state(
              journal_path,
              "این مقاله پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute">
    <BookOpenText aria-hidden="true" size={34} />
  </span>
  <h1 className="text-display-3 text-bone">این مقاله پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">
    آدرس مقاله معتبر نیست یا این مطلب دیگر در فهرست ژورنال قرار ندارد.
  </p>
  <Link to="/journal" className={CtaClasses("signal")}>
    بازگشت به ژورنال
  </Link>
</div>''',
          )
          journal_text = journal_path.read_text().replace("  EmptyState,\n", "")
          journal_path.write_text(journal_text)
          PY

      - name: Format changed files
        run: npx prettier --write 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'

      - name: Commit scoped fixes
        run: |
          if git diff --quiet; then
            echo "Scoped fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'
          git commit -m "F7: correct not-found heading hierarchy"
          git push origin HEAD:phase/f7-content-editorial
