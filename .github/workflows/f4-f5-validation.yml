name: F4 F5 validation

on:
  push:
    branches:
      - tmp/f4-f5-validation-20260804

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate ephemeral npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: npm ci
        run: npm ci

      - name: Format owned F4/F5 files
        run: >-
          npx prettier --write
          'src/routes/shop.tsx'
          'src/routes/$category.tsx'
          'src/routes/search.tsx'
          'src/routes/product.$slug.tsx'
          'src/components/lbb/ProductCard.tsx'
          'src/components/lbb/ProductFilters.tsx'
          'src/components/lbb/ProductGridControls.tsx'
          'src/components/lbb/ProductQuickView.tsx'
          'src/components/lbb/product/Gallery.tsx'
          'src/components/lbb/product/StickyBuyBar.tsx'
          'src/lib/product-filter.ts'
          'src/lib/quickview.tsx'
          'src/lib/recent-searches.ts'
          'src/lib/recently-viewed.ts'

      - name: Detect formatting changes
        id: formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            'src/routes/shop.tsx' \
            'src/routes/$category.tsx' \
            'src/routes/search.tsx' \
            'src/routes/product.$slug.tsx' \
            'src/components/lbb/ProductCard.tsx' \
            'src/components/lbb/ProductFilters.tsx' \
            'src/components/lbb/ProductGridControls.tsx' \
            'src/components/lbb/ProductQuickView.tsx' \
            'src/components/lbb/product/Gallery.tsx' \
            'src/components/lbb/product/StickyBuyBar.tsx' \
            'src/lib/product-filter.ts' \
            'src/lib/quickview.tsx' \
            'src/lib/recent-searches.ts' \
            'src/lib/recently-viewed.ts'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lbb-preview.log 2>&1 &
          echo $! > /tmp/lbb-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/shop > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lbb-preview.log
          exit 1

      - name: Browser routes, history and accessibility
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const widths = [390, 768, 1440, 1920];
          const normalRoutes = [
            '/shop',
            '/shop?sort=price-asc',
            '/shop?cats=hoodies,pants&colors=%230A0A0A&sizes=M&instock=true&sort=price-asc',
            '/hoodies',
            '/search?q=%D9%87%D9%88%D8%AF%DB%8C',
            '/product/lbb-classic-hoodie',
          ];

          const checkPage = async (page, route, width) => {
            const errors = [];
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
            const response = await page.goto(origin + route, { waitUntil: 'networkidle' });
            if (!response || response.status() >= 400) {
              failures.push(`${width}px ${route}: status ${response?.status() ?? 'none'}`);
            }
            await page.reload({ waitUntil: 'networkidle' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 2) failures.push(`${width}px ${route}: horizontal overflow ${overflow}px`);
            if (errors.length) failures.push(`${width}px ${route}: ${errors.join(' | ')}`);
          };

          for (const width of widths) {
            for (const route of normalRoutes) {
              const page = await browser.newPage({ viewport: { width, height: 1000 } });
              await checkPage(page, route, width);
              await page.close();
            }
          }

          {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto(origin + '/shop', { waitUntil: 'networkidle' });
            await page.getByLabel('مرتب‌سازی محصولات').click();
            await page.getByRole('option', { name: 'ارزان‌ترین' }).click();
            await page.waitForURL(/sort=price-asc/);
            await page.getByText('فقط کالاهای موجود', { exact: true }).click();
            await page.waitForURL(/instock=true/);
            await page.goBack({ waitUntil: 'networkidle' });
            if (!new URL(page.url()).searchParams.has('sort') || new URL(page.url()).searchParams.has('instock')) {
              failures.push('history back did not restore sort-only state');
            }
            await page.goBack({ waitUntil: 'networkidle' });
            if (new URL(page.url()).pathname !== '/shop' || new URL(page.url()).search) {
              failures.push('history back did not restore clean /shop');
            }
            await page.goForward({ waitUntil: 'networkidle' });
            if (new URL(page.url()).searchParams.get('sort') !== 'price-asc') {
              failures.push('history forward did not restore sort state');
            }
            await page.close();
          }

          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(origin + '/shop?sort=newest&cats=pants,hoodies,hoodies&bogus=1', { waitUntil: 'networkidle' });
            const params = new URL(page.url()).searchParams;
            if (params.get('cats') !== 'hoodies,pants' || params.has('sort') || params.has('bogus')) {
              failures.push(`canonical cleanup failed: ${page.url()}`);
            }

            const trigger = page.locator('button[aria-label^="نمای سریع"]').first();
            await trigger.evaluate((element) => element.setAttribute('data-qv-trigger', 'true'));
            await trigger.click();
            const dialog = page.getByRole('dialog');
            await dialog.waitFor();
            const focusInside = await page.evaluate(() => document.activeElement?.closest('[role="dialog"]') !== null);
            if (!focusInside) failures.push('Quick View did not move focus into dialog');
            await page.keyboard.press('Shift+Tab');
            const wrappedToLast = await page.evaluate(() => document.activeElement?.closest('[role="dialog"]') !== null);
            if (!wrappedToLast) failures.push('Quick View Shift+Tab escaped dialog');
            await page.keyboard.press('Tab');
            const wrappedToFirst = await page.evaluate(() => document.activeElement?.closest('[role="dialog"]') !== null);
            if (!wrappedToFirst) failures.push('Quick View Tab escaped dialog');
            await page.keyboard.press('Escape');
            await dialog.waitFor({ state: 'detached' });
            const restored = await page.evaluate(() => document.activeElement?.getAttribute('data-qv-trigger') === 'true');
            if (!restored) failures.push('Quick View did not restore focus to trigger');
            await page.close();
          }

          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(origin + '/product/lbb-classic-hoodie', { waitUntil: 'networkidle' });
            const gallery = page.getByRole('region', { name: /گالری تصاویر/ });
            await gallery.focus();
            await page.keyboard.press('End');
            await page.getByText('تصویر 4 از 4', { exact: true }).waitFor();
            await page.keyboard.press('Home');
            await page.getByText('تصویر 1 از 4', { exact: true }).waitFor();
            await page.close();
          }

          for (const route of ['/product/not-a-real-product', '/definitely-not-found']) {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const response = await page.goto(origin + route, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 404) failures.push(`${route}: expected 404, got ${response?.status() ?? 'none'}`);
            await page.close();
          }

          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Browser validation passed at 390, 768, 1440 and 1920.');
          NODE

      - name: Upload formatted owned files
        if: always() && steps.formatting.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f4-f5-formatted-source
          path: |
            src/routes/shop.tsx
            src/routes/$category.tsx
            src/routes/search.tsx
            src/routes/product.$slug.tsx
            src/components/lbb/ProductCard.tsx
            src/components/lbb/ProductFilters.tsx
            src/components/lbb/ProductGridControls.tsx
            src/components/lbb/ProductQuickView.tsx
            src/components/lbb/product/Gallery.tsx
            src/components/lbb/product/StickyBuyBar.tsx
            src/lib/product-filter.ts
            src/lib/quickview.tsx
            src/lib/recent-searches.ts
            src/lib/recently-viewed.ts

      - name: Require committed formatting
        if: always() && steps.formatting.outputs.changed == 'true'
        run: |
          echo 'Prettier changed owned files; apply the uploaded artifact and rerun.'
          exit 1
