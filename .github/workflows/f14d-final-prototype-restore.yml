name: F14D Final Prototype Regression Restore

on:
  push:
    branches:
      - phase/f14d-production-backend-integration

permissions:
  contents: write

jobs:
  restore-reviewed-prototype:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore accepted Wave 2 prototype surfaces while preserving F14D live mode
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/wave2-reviewed:refs/remotes/origin/integration/wave2-reviewed
          python <<'PY'
          from pathlib import Path
          import subprocess

          BASE = 'origin/integration/wave2-reviewed'

          def base(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{BASE}:{path}'], text=True)

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text.rstrip() + '\n')

          def tail(source: str, marker: str) -> str:
              idx = source.index(marker)
              return source[idx:]

          def segment(source: str, start_marker: str, end_marker: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[start:end]

          def replace_tail(path: str, marker: str, replacement: str) -> None:
              current = read(path)
              idx = current.index(marker)
              write(path, current[:idx] + replacement)

          def replace_segment(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              current = read(path)
              start = current.index(start_marker)
              end = current.index(end_marker, start)
              write(path, current[:start] + replacement.rstrip() + '\n\n' + current[end:])

          # Checkout: prototype must remain the exact fail-closed Wave 2 experience.
          path = 'src/routes/checkout.tsx'
          prototype = tail(base(path), 'function Checkout() {').replace(
              'function Checkout() {', 'function PrototypeCheckout() {', 1
          )
          replace_tail(path, 'function PrototypeCheckout() {', prototype)

          # Collections index: restore the accepted editorial DOM, status chips, story points and action.
          path = 'src/routes/collections.index.tsx'
          prototype = tail(base(path), 'function CollectionsIndexPage() {').replace(
              'function CollectionsIndexPage() {', 'function PrototypeCollections() {', 1
          )
          replace_tail(path, 'function PrototypeCollections() {', prototype)

          # Account: keep the live customer/orders flow, but make prototype byte-for-byte equivalent in UI intent.
          path = 'src/routes/account.tsx'
          old = base(path)
          action_start = old.index('const actions = [')
          action_end = old.index('\n];', action_start) + 3
          prototype_actions = old[action_start:action_end].replace(
              'const actions = [', 'const prototypeActions = [', 1
          )
          prototype = tail(old, 'function AccountPage() {').replace(
              'function AccountPage() {', 'function PrototypeAccount() {', 1
          ).replace('actions.map(', 'prototypeActions.map(')
          replace_tail(path, 'function PrototypeAccount() {', prototype_actions + '\n\n' + prototype)

          # Search: restore debounce/history semantics, result status, empty actions and accepted visual copy.
          path = 'src/routes/search.tsx'
          old = base(path)
          highlight = segment(old, 'function highlight(', '\nexport const Route')
          prototype = tail(old, 'function SearchPage() {').replace(
              'function SearchPage() {', 'function PrototypeSearch() {', 1
          ).replace('matchesQuery(', 'localMatches(')
          replace_tail(path, 'function PrototypeSearch() {', highlight + '\n\n' + prototype)

          # PDP: restore all prototype evidence/trust/editorial sections exactly; live PDP remains untouched.
          path = 'src/routes/product.$slug.tsx'
          old = base(path)
          prototype = tail(old, 'function ProductPage() {').replace(
              'function ProductPage() {', 'function PrototypeProductPage({ loader }: { loader: PrototypeLoader }) {', 1
          )
          prototype = prototype.replace(
              '  const { product, related } = Route.useLoaderData();\n',
              '  const { product, related } = loader;\n',
              1,
          )
          replace_segment(path, 'function PrototypeProductPage(', 'function PageChrome(', prototype)

          # Shop: restore accepted hero/status/filter reset/end-state markup in prototype only.
          path = 'src/routes/shop.tsx'
          old = base(path)
          prototype = tail(old, 'function ShopPage() {').replace(
              'function ShopPage() {', 'function PrototypeShop() {', 1
          )
          replace_segment(path, 'function PrototypeShop() {', 'function ShopChrome(', prototype)

          # Category: restore bullets, reset CTA, FAQ, accessibility labels and accepted visual contract.
          path = 'src/routes/$category.tsx'
          old = base(path)
          prototype = tail(old, 'function CategoryPage() {').replace(
              'function CategoryPage() {', 'function PrototypeCategory({ loader }: { loader: PrototypeLoader }) {', 1
          )
          prototype = prototype.replace(
              '  const { cat, items } = Route.useLoaderData();\n',
              '  const { cat, items } = loader;\n',
              1,
          )
          replace_tail(path, 'function PrototypeCategory(', prototype)

          # Preserve backend price-range support but restore Wave 2 truth-safe prototype fallback copy.
          path = 'src/components/lbb/product/ProductIdentity.tsx'
          current = read(path)
          current = current.replace(
              '      {identity.shortDescription ? (\n        <p className="mt-3 text-sm leading-7 text-metal">{identity.shortDescription}</p>\n      ) : null}',
              '      {identity.shortDescription ? (\n        <p className="mt-3 text-sm leading-7 text-metal">{identity.shortDescription}</p>\n      ) : (\n        <p className="mt-3 max-w-[52ch] text-sm leading-7 text-metal">\n          این رکورد برای توسعه رابط حفظ شده است، اما هویت و مشخصات آن هنوز برای نمایش عمومی تأیید\n          نشده‌اند.\n        </p>\n      )}',
          )
          current = current.replace(
              '<p className="mt-5 text-sm font-semibold text-metal">قیمت عمومی در دسترس نیست.</p>',
              '<p className="mt-5 text-sm font-semibold text-metal">\n          قیمت عمومی این محصول هنوز تأیید نشده است.\n        </p>',
          )
          write(path, current)
          PY

          npx prettier --write \
            src/routes/checkout.tsx \
            src/routes/collections.index.tsx \
            src/routes/account.tsx \
            src/routes/search.tsx \
            'src/routes/product.$slug.tsx' \
            src/routes/shop.tsx \
            'src/routes/$category.tsx' \
            src/components/lbb/product/ProductIdentity.tsx

          git rm .github/workflows/f14d-final-prototype-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No prototype regression changes were required.'
            exit 0
          fi
          git commit -m 'fix(f14d): restore reviewed prototype behavior and visuals'
          git push origin HEAD:phase/f14d-production-backend-integration
