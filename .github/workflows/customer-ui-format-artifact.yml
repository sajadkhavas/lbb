name: Customer UI Format Artifact

on:
  push:
    branches:
      - fix/customer-ui-polish-20260916

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed UI files
        run: >-
          npx prettier --write
          src/routes/account.tsx
          src/routes/checkout.tsx
          src/routes/payment.result.tsx
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: customer-ui-prettier
          path: |
            src/routes/account.tsx
            src/routes/checkout.tsx
            src/routes/payment.result.tsx
          if-no-files-found: error
