name: F8 F9 final validation

on:
  pull_request:
    branches:
      - validation/f8-f9-final

permissions:
  contents: read

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f8-f9-final-quality
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Formatting gate
        run: npm run format:check

      - name: ESLint gate
        run: npm run lint

      - name: Production build and route generation gate
        run: npm run build

      - name: Diagnose Worker SSR error location
        run: |
          for file in .output/server/_ssr/router-*.mjs; do
            echo "===== $file ====="
            nl -ba "$file" | sed -n '1735,1815p'
          done

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run audit:dependencies

      - name: Deployment output audit
        run: npm run audit:production

      - name: Production source audit
        run: npm run audit:source

      - name: Cloudflare Worker smoke gate
        run: npm run smoke:production

      - name: Playwright acceptance suite
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f8-f9-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
