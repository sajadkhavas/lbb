name: F8 F9 final validation

on:
  pull_request:
    branches:
      - validation/f8-f9-final

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f8-f9-final-quality
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic final fixes
        run: python scripts/apply-f8-f9-final-fixes.py

      - name: Rebuild lockfile and install dependencies
        run: |
          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm install --ignore-scripts

      - name: Format entire repository
        run: npx prettier --write .

      - name: Commit fixes, lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(f8-f9): close accessibility, focus and navigation gates'
            git push origin HEAD:phase/f8-f9-final-quality
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Commit visual baselines
        run: |
          git add tests/visual.spec.ts-snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'test(f9): refresh accessible responsive visual baselines'
            git push origin HEAD:phase/f8-f9-final-quality
          fi

      - name: Formatting gate
        run: npm run format:check

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint

      - name: Production build gate
        run: npm run build

      - name: Deployment output audit
        run: npm run audit:production

      - name: Production source audit
        run: npm run audit:source

      - name: Production preview smoke gate
        run: npm run smoke:production

      - name: Playwright acceptance suite
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f8-f9-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
