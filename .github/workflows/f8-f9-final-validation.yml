name: F8 F9 final validation

on:
  pull_request:
    branches:
      - validation/f8-f9-final

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f8-f9-final-quality
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Split pure product catalogue from compatibility facade
        run: |
          if [ ! -f src/lib/product-catalog.ts ]; then
            cp src/lib/products.ts src/lib/product-catalog.ts
          fi
          printf 'export * from "./product-catalog";\n' > src/lib/products.ts
          python -c 'from pathlib import Path; p=Path("src/lib/product-filter.ts"); s=p.read_text(); s=s.replace("from \"./products\"", "from \"./product-catalog\""); p.write_text(s)'
          npx prettier --write src/lib/product-catalog.ts src/lib/products.ts src/lib/product-filter.ts scripts/audit-source.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/product-catalog.ts src/lib/products.ts src/lib/product-filter.ts scripts/audit-source.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(f8): break product catalogue filter evaluation cycle'
            git push origin HEAD:phase/f8-f9-final-quality
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Formatting gate
        run: npm run format:check

      - name: ESLint gate
        run: npm run lint

      - name: Production build and route generation gate
        run: npm run build

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run audit:dependencies

      - name: Deployment output audit
        run: npm run audit:production

      - name: Production source audit
        run: npm run audit:source

      - name: Cloudflare Worker smoke gate
        run: npm run smoke:production

      - name: Playwright acceptance suite
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f8-f9-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
