const origin = "http://127.0.0.1:4173";

test("canonical, robots and sitemap are absolute and environment-aware", async ({ page, request }) => {
  await page.goto("/shop", { waitUntil: "networkidle" });
  const canonical = await page.locator('link[rel="canonical"]').getAttribute("href");
  expect(canonical).toBe("https://lbb.example.test/shop");

  const robots = await request.get(`${origin}/robots.txt`);
  expect(robots.ok()).toBe(true);
  expect(await robots.text()).toContain("Sitemap: https://lbb.example.test/sitemap.xml");

  const sitemap = await request.get(`${origin}/sitemap.xml`);
  expect(sitemap.ok()).toBe(true);
  const xml = await sitemap.text();
  expect(xml).toContain("<loc>https://lbb.example.test/</loc>");
  expect(xml).not.toMatch(/<loc>\//);
});

test("filtered listing URLs are noindex with a clean canonical", async ({ page }) => {
  await page.goto("/hoodies?sizes=M&sort=price-asc", { waitUntil: "networkidle" });
  await expect(page.locator('meta[name="robots"]')).toHaveAttribute("content", /noindex/);
  await expect(page.locator('link[rel="canonical"]')).toHaveAttribute(
    "href",
    "https://lbb.example.test/hoodies",
  );
});

test("fonts are self-hosted, loaded and free of external font requests", async ({ page, request }) => {
  const externalFonts: string[] = [];
  page.on("request", (req) => {
    const url = req.url();
    if (/fonts\.googleapis|fonts\.gstatic|use\.typekit|fontshare/i.test(url)) externalFonts.push(url);
  });

  await page.goto("/", { waitUntil: "networkidle" });
  await page.evaluate(() => document.fonts.ready);
  expect(await page.evaluate(() => document.fonts.check('16px "Estedad"'))).toBe(true);
  expect(await page.evaluate(() => document.fonts.check('16px "JetBrains Mono"'))).toBe(true);
  expect(externalFonts).toEqual([]);

  const stylesheets = await page.locator('link[rel="stylesheet"]').evaluateAll((links) =>
    links.map((link) => (link as HTMLLinkElement).href),
  );
  const fontUrls: string[] = [];
  for (const stylesheet of stylesheets) {
    const response = await request.get(stylesheet);
    if (!response.ok()) continue;
    const css = await response.text();
    for (const match of css.matchAll(/url\(([^)]+\.woff2)\)/g)) {
      fontUrls.push(new URL(match[1].replace(/["']/g, ""), stylesheet).href);
    }
  }
  expect(fontUrls.length).toBeGreaterThan(0);
  expect(fontUrls.every((url) => new URL(url).origin === origin)).toBe(true);
  expect((await request.get(fontUrls[0])).ok()).toBe(true);
});

test("PWA files are valid and navigation is not cached with a stale-first strategy", async ({ request }) => {
  const manifest = await request.get(`${origin}/manifest.webmanifest`);
  expect(manifest.ok()).toBe(true);
  const data = await manifest.json();
  expect(data.name).toBe("LBB — لباس برای بیرون");
  expect(data.start_url).toBe("/");

  const worker = await request.get(`${origin}/sw.js`);
  expect(worker.ok()).toBe(true);
  const source = await worker.text();
  expect(source).toContain('request.mode === "navigate"');
  expect(source).not.toMatch(/navigate[\s\S]{0,500}caches\.match/i);
});
''')

          Path("scripts/smoke-production.mjs").write_text('''import { spawn } from "node:child_process";
import process from "node:process";

const host = "127.0.0.1";
const port = 4287;
const origin = `http://${host}:${port}`;
const productionOrigin = process.env.VITE_SITE_URL;

if (!productionOrigin) {
  throw new Error("VITE_SITE_URL is required for the production smoke test.");
}

let logs = "";
const executable = process.platform === "win32" ? "node_modules/.bin/vite.cmd" : "node_modules/.bin/vite";
const server = spawn(executable, ["preview", "--host", host, "--port", String(port), "--strictPort"], {
  env: process.env,
  stdio: ["ignore", "pipe", "pipe"],
});

server.stdout.on("data", (chunk) => {
  logs += chunk.toString();
});
server.stderr.on("data", (chunk) => {
  logs += chunk.toString();
});

async function waitForServer() {
  const deadline = Date.now() + 30_000;
  while (Date.now() < deadline) {
    if (server.exitCode !== null) {
      throw new Error(`Production preview exited early (${server.exitCode}).\n${logs}`);
    }
    try {
      const response = await fetch(`${origin}/`);
      if (response.ok) return;
    } catch {
      // Preview is still starting.
    }
    await new Promise((resolve) => setTimeout(resolve, 250));
  }
  throw new Error(`Production preview did not become ready.\n${logs}`);
}

async function assertResponse(path, expectedType, requiredText) {
  const response = await fetch(`${origin}${path}`, { redirect: "manual" });
  const body = await response.text();
  if (!response.ok) {
    throw new Error(`${path} returned ${response.status}.\n${body.slice(0, 500)}`);
  }
  const contentType = response.headers.get("content-type") ?? "";
  if (!contentType.includes(expectedType)) {
    throw new Error(`${path} returned unexpected content type: ${contentType}`);
  }
  for (const text of requiredText) {
    if (!body.includes(text)) throw new Error(`${path} is missing expected content: ${text}`);
  }
}

try {
  await waitForServer();
  await assertResponse("/", "text/html", ["<html", 'dir="rtl"', "LBB"]);
  await assertResponse("/product/lbb-classic-hoodie", "text/html", ["LBB Classic Hoodie", 'dir="rtl"']);
  await assertResponse("/sitemap.xml", "application/xml", [`<loc>${productionOrigin}/</loc>`]);
  await assertResponse("/robots.txt", "text/plain", [`Sitemap: ${productionOrigin}/sitemap.xml`]);
  console.log("Production preview smoke test passed.");
} finally {
  server.kill("SIGTERM");
  await Promise.race([
    new Promise((resolve) => server.once("exit", resolve)),
    new Promise((resolve) => setTimeout(resolve, 2_000)),
  ]);
  if (server.exitCode === null) server.kill("SIGKILL");
}
''')

