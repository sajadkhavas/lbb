name: F7 heading patch

on:
  pull_request:
    branches:
      - validation/f7-heading-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial
          fetch-depth: 0

      - name: Apply page-level headings
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_empty_state(path: Path, title: str, replacement: str) -> None:
              text = path.read_text()
              if f'<h1 className="text-display-3 text-bone">{title}</h1>' in text:
                  return

              marker_index = text.index(f'title="{title}"')
              start = text.rfind("<EmptyState", 0, marker_index)
              end = text.index("/>", marker_index) + 2
              if start < 0:
                  raise RuntimeError(f"EmptyState start not found in {path}")

              line_start = text.rfind("\n", 0, start) + 1
              indent = text[line_start:start]
              rendered = "\n".join(indent + line for line in replacement.splitlines())
              path.write_text(text[:line_start] + rendered + text[end:])

          replace_empty_state(
              Path("src/routes/collections.$slug.tsx"),
              "این کالکشن پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 rounded-2xl border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute">
    <Layers3 aria-hidden="true" size={34} />
  </span>
  <h1 className="text-display-3 text-bone">این کالکشن پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">
    آدرس کالکشن معتبر نیست یا این صفحه دیگر در فهرست کالکشن‌های LBB قرار ندارد.
  </p>
  <Link to="/collections" className={CtaClasses("signal")}>
    بازگشت به کالکشن‌ها
  </Link>
</div>''',
          )

          journal = Path("src/routes/journal.$slug.tsx")
          replace_empty_state(
              journal,
              "این مقاله پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 rounded-2xl border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute">
    <BookOpenText aria-hidden="true" size={34} />
  </span>
  <h1 className="text-display-3 text-bone">این مقاله پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">
    آدرس مقاله معتبر نیست یا این مطلب دیگر در فهرست ژورنال قرار ندارد.
  </p>
  <Link to="/journal" className={CtaClasses("signal")}>
    بازگشت به ژورنال
  </Link>
</div>''',
          )
          journal.write_text(journal.read_text().replace("  EmptyState,\n", ""))
          PY

      - name: Format, commit and push
        run: |
          npx prettier --write 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'
          if git diff --cached --quiet; then
            echo "Heading patch already present."
            exit 0
          fi
          git commit -m "fix(f7): use page-level headings for invalid slugs"
          git push origin HEAD:phase/f7-content-editorial
