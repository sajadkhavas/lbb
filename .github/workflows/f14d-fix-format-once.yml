name: F14D Fix And Format Once

on:
  push:
    branches:
      - phase/f14d-production-backend-integration

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/f14d-production-backend-integration
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply hardening patch
        run: node scripts/f14d-hardening-once.mjs
      - name: Format F14D diff
        shell: bash
        run: |
          BASE=9f8cc0f0aa4e2f8b4c8681f2c3b2786874c04fdc
          git diff --name-only "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml' '*.md' '*.css' | xargs -r npx prettier --write
      - name: ESLint fix F14D TypeScript
        shell: bash
        run: |
          BASE=9f8cc0f0aa4e2f8b4c8681f2c3b2786874c04fdc
          git diff --name-only "$BASE" HEAD -- '*.ts' '*.tsx' | xargs -r npx eslint --fix
      - name: Commit formatted hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F14D: harden browser session and format integration'
          git push origin HEAD:phase/f14d-production-backend-integration
