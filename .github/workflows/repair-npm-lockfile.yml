name: Repair npm lockfile

on:
  push:
    branches:
      - phase/f8-quality-foundation
    paths:
      - .github/workflows/repair-npm-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-npm-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase/f8-quality-foundation

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Rebuild lockfile from scratch
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Validated lockfile is unchanged."
          else
            git commit -m "fix(quality): repair npm lockfile"
            git push origin HEAD:phase/f8-quality-foundation
          fi
