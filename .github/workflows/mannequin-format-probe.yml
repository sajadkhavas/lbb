name: Mannequin format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier --write src/components/lbb/product/Gallery.tsx src/lib/backend-storefront.ts
          git diff -- src/components/lbb/product/Gallery.tsx src/lib/backend-storefront.ts
