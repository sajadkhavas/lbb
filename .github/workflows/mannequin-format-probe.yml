name: Mannequin format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier --write src/lib/product-decision.ts src/lib/product-decision-policy.ts tests/fc1-style-mannequin.spec.ts
          git diff -- src/lib/product-decision.ts src/lib/product-decision-policy.ts tests/fc1-style-mannequin.spec.ts
