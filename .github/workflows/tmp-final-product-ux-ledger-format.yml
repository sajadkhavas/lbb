name: Temporary Final Product UX Ledger Formatter

on:
  push:
    branches:
      - hotfix/final-product-ux-gate

permissions:
  contents: write

jobs:
  format-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: 7fd7a4f2fa81c680289341d402cf2e8b24b8c2e9
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/final-product-ux
          fetch-depth: 0

      - name: Lock exact implementation source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format only reconciled ledger
        run: npx prettier --write docs/LBB_PROJECT_MASTER_LEDGER_FA.md

      - name: Guard ledger-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git diff --name-only)"
          printf 'ACTUAL_DELTA=%s\n' "$ACTUAL"
          test "$ACTUAL" = 'docs/LBB_PROJECT_MASTER_LEDGER_FA.md'
          git diff --check
          npx prettier --check docs/LBB_PROJECT_MASTER_LEDGER_FA.md

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LBB_PROJECT_MASTER_LEDGER_FA.md
          git commit -m 'docs: format reconciled master ledger'
          git push origin HEAD:hotfix/final-product-ux
