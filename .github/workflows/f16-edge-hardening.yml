name: F16 Edge Hardening One-Shot

on:
  push:
    branches:
      - phase/f16-cart-commerce-continuity

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f16-cart-commerce-continuity
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Harden terminal-order and fresh-cart recovery edges
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write src/routes/checkout.tsx src/lib/checkout-continuity.ts scripts/audit-f16-continuity.mjs
      - name: Lint
        run: npm run lint
      - name: Build live mode
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run build
      - name: Typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run typecheck
      - name: Preserve F14D contract
        run: node scripts/audit-f14d-integration.mjs
      - name: F16 continuity audit
        run: npm run audit:f16
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: F16 browser tests
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run test:f16
      - name: Commit validated edge hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx src/lib/checkout-continuity.ts scripts/audit-f16-continuity.mjs src/routeTree.gen.ts
          git diff --cached --quiet && { echo "No edge changes to commit"; exit 1; }
          git commit -m "fix(f16): retire terminal checkout recovery state"
          git push origin HEAD:phase/f16-cart-commerce-continuity
