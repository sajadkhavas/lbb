name: F14 catalogue artifact validation

on:
  pull_request:
    branches:
      - validation/f14-product-listing-discovery-2

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f14-product-listing-discovery-2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format F14 scope
        run: |
          npx prettier --write \
            src/routeTree.gen.ts \
            src/routes/shop.tsx \
            'src/routes/$category.tsx' \
            src/routes/search.tsx \
            src/lib/catalog-discovery.ts \
            src/components/lbb/ProductFilters.tsx \
            src/components/lbb/ProductGridControls.tsx \
            scripts/audit-source.mjs \
            tests/catalog-discovery.spec.ts \
            tests/catalog-visual.spec.ts \
            tests/navigation-history.spec.ts \
            tests/visual.spec.ts \
            docs/f14

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines
        run: npx playwright test tests/visual.spec.ts tests/catalog-visual.spec.ts --update-snapshots

      - name: Commit generated F14 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/routeTree.gen.ts \
            src/routes/shop.tsx \
            'src/routes/$category.tsx' \
            src/routes/search.tsx \
            src/lib/catalog-discovery.ts \
            src/components/lbb/ProductFilters.tsx \
            src/components/lbb/ProductGridControls.tsx \
            scripts/audit-source.mjs \
            tests/catalog-discovery.spec.ts \
            tests/catalog-visual.spec.ts \
            tests/navigation-history.spec.ts \
            tests/visual.spec.ts \
            tests/visual.spec.ts-snapshots \
            tests/catalog-visual.spec.ts-snapshots \
            docs/f14
          if ! git diff --cached --quiet; then
            git commit -m 'test(f14): register catalogue discovery artifacts'
            git push origin HEAD:phase/f14-product-listing-discovery-2
          fi

      - name: Run complete immutable quality suite
        run: npm run quality

      - name: Verify tracked files remain stable
        run: git diff --exit-code -- . ':(exclude)playwright-report' ':(exclude)test-results'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f14-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
