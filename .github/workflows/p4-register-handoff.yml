name: P4 Registration Helper

on:
  push:
    branches:
      - phase/lbb-p4-registration
    paths:
      - .github/workflows/p4-register-handoff.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/lbb-p4-registration
      - name: Update master handoff
        run: python3 scripts/p4-register-handoff.py
      - name: Commit registration and remove helpers
        run: |
          rm .github/workflows/p4-register-handoff.yml
          rm scripts/p4-register-handoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LBB_MASTER_HANDOFF_FA.md .github/workflows/p4-register-handoff.yml scripts/p4-register-handoff.py
          git commit -m "docs(p4): register merged commerce candidate in master handoff [p4-register]"
          git push origin HEAD:phase/lbb-p4-registration
