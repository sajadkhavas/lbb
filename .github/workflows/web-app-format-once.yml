name: Web App Format Once

on:
  push:
    branches:
      - phase/web-app-push-notifications

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/web-app-push-notifications
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format new phase files
        run: npx prettier --write public/sw.js public/manifest.webmanifest scripts/audit-web-app-push.mjs src/components/lbb/WebAppPushPanel.tsx src/lib/push-api.ts src/lib/pwa.ts src/routes/__root.tsx src/routes/web-app.tsx src/lib/navigation.ts tests/web-app-push.spec.ts package.json .github/workflows/web-app-push.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts src tests package.json .github/workflows/web-app-push.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(pwa): format Web App and Push phase'
          git push origin HEAD:phase/web-app-push-notifications
