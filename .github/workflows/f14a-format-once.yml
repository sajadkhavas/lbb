name: F14A format once

on:
  push:
    branches:
      - phase/f14a-brand-commerce-constitution
    paths:
      - .github/workflows/f14a-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/f14a-brand-commerce-constitution

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format changed source and documentation
        run: npx prettier --write docs/F14A_BRAND_COMMERCE_CONSTITUTION.md src/components/lbb/home/TickerStrip.tsx src/lib/brand.ts src/routes/contact.tsx src/routes/size-guide.tsx

      - name: Remove one-time workflow
        run: rm .github/workflows/f14a-format-once.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/F14A_BRAND_COMMERCE_CONSTITUTION.md \
            src/components/lbb/home/TickerStrip.tsx \
            src/lib/brand.ts \
            src/routes/contact.tsx \
            src/routes/size-guide.tsx \
            .github/workflows/f14a-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "F14A: format brand foundation"
          git push origin HEAD:phase/f14a-brand-commerce-constitution
