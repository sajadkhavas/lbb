name: Temporary PR88 Test Prettier

on:
  push:
    branches:
      - hotfix/final-product-ux-gate

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/final-product-ux
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository-exact Prettier to focused test
        run: |
          npx prettier --write tests/final-product-ux-hotfix.spec.ts
          npx prettier --check tests/final-product-ux-hotfix.spec.ts
          git diff --check

      - name: Commit formatter output to implementation branch
        run: |
          if git diff --quiet; then
            echo 'FORMAT_CHANGES=NO'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/final-product-ux-hotfix.spec.ts
          git commit -m 'style: format final product UX hotfix test'
          git push origin HEAD:hotfix/final-product-ux
