name: P3 Final Diagnostic Cleanup

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[p3-cleanup-format]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format matrix and verify static gates
        run: |
          npx prettier --write docs/P3_CONTROL_SURFACE_MATRIX.md
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Remove diagnostic artifacts and commit
        run: |
          rm -f docs/_p3_lint_diagnostic.txt .github/workflows/p3-lint-diagnostic.yml
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add -A
          git commit -m 'chore(p3): finalize clean acceptance tree'
          git push origin HEAD:phase/p3-live-integration-control-surface
