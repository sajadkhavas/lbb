name: P1.3 Closure Registration Helper

on:
  push:
    branches:
      - phase/p1-3-seo-semantic-content-polish

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/p1-3-seo-semantic-content-polish
          fetch-depth: 0

      - name: Reconcile closure documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('docs/LBB_MASTER_HANDOFF_FA.md')
          text = master.read_text()

          old = '''### P1.2 Visual Polish — NEXT

- اجرای Brand Intro
- spacing / typography / hierarchy / cards / hero / header / mobile
- استفاده از Business Truth واقعی
- عدم حذف Size Guide یا اطلاعات فعلی معتبر

### P1.3 SEO Semantic & Content Polish

- rewrite محتوا بر اساس Business Truth و Search Intent
- local / category / FAQ / schema reconciliation
- بدون keyword stuffing
'''
          new = '''### P1.2 Visual + Content Polish — **DONE / MERGED 2026-09-03**

- PR #60 merged into `fix/lbb-local-boutique-homepage`.
- Merge SHA: `1d6fd9170788e9e765c17fc4b29987b87436d283`.
- Brand Intro، Business Truth copy، navigation/taxonomy و category landing reconciliation انجام شد.
- Exact-head quality gates برای closureهای P1.2 سبز شدند.
- Production deployment در خود P1.2 انجام نشد؛ Production baseline فقط با activation پذیرفته‌شده تغییر می‌کند.

### P1.3 SEO Semantic & Content Polish — **DONE / EXACT-HEAD GATED / READY TO MERGE**

- Tracking issue: #61
- PR: #62
- Search-intent و route mapping بر اساس Evidence ثبت شد.
- Categoryها به intent خرید نوع محصول منتقل شدند؛ `کرج` فقط در local surfaces واقعی نگه داشته شد.
- هیچ gender modifier مانند `مردانه` بدون data contract معتبر به metadata تحمیل نشد.
- Shop/About metadata، FAQ/HowTo/SearchAction legacy markup و internal linking reconcile شدند.
- Canonical / noindex / sitemap / robots / SSR-head contracts verify شدند.
- Dedicated P1.3 regression coverage اضافه شد.
- Validated implementation SHA پیش از closure-doc reconciliation: `03875bec5b619239c23aa502f1749447b0b14ed4`.
- Quality Gates run `33983418418`: **SUCCESS**.
- Production mutation: **NO**.
'''
          if old not in text:
              raise SystemExit('Roadmap P1.2/P1.3 block not found')
          text = text.replace(old, new)

          old = '''4. برای P1.2 یک Branch/Worktree تمیز از Baseline پذیرفته‌شده بسازد.
5. Business Truth این سند را با داده ساختگی جایگزین نکند.
6. تغییرات UI و SEO را صفحه‌به‌صفحه انجام دهد و بعد QA کند.
7. Backend و commerce را فقط پس از audit و contract reconciliation به live ببرد.

### CURRENT NEXT

**`P1.2 — Visual + Content Polish`**

با این قاعده که SEO همان صفحه در زمان redesign همان صفحه لحاظ شود تا دوباره‌کاری کم شود؛ سپس P1.3 برای reconciliation نهایی semantic/technical SEO اجرا شود.
'''
          new = '''4. برای فاز بعدی Branch/Worktree تمیز از آخرین baseline پذیرفته‌شده بسازد.
5. Business Truth این سند را با داده ساختگی جایگزین نکند.
6. تغییرات UI و SEO را صفحه‌به‌صفحه انجام دهد و بعد QA کند.
7. Backend و commerce را فقط پس از audit و contract reconciliation به live ببرد.

### CURRENT NEXT

**`P1.4 — Regression QA + Frontend Freeze`**

P1.4 باید responsive، accessibility، SSR/hydration، performance و SEO contracts را روی baseline نهایی Frontend دوباره تأیید کند و سپس یک Frontend Freeze SHA صریح برای ورود به فازهای Backend/Live Integration ثبت شود.
'''
          if old not in text:
              raise SystemExit('CURRENT NEXT block not found')
          text = text.replace(old, new)
          master.write_text(text)

          decision = Path('docs/P1_3_SEO_DECISION_LOG.md')
          d = decision.read_text()
          extra = '''

## D4 — Category intent is transactional, not templated-local

Decision: current public product categories target buying/browsing the product family. `کرج` is not appended mechanically to every category title.

Reason: representative live SERP composition supports ecommerce category/product intent for these query families, while local-store intent is stronger on Home/Contact/store surfaces.

## D5 — Do not force unsupported gender modifiers

Decision: do not template `مردانه` into category metadata until the catalog has an authoritative gender/audience field or production evidence explicitly justifies a dedicated landing strategy.

Reason: business audience demographics are not the same thing as a per-product gender data contract.

## D6 — Retired search-feature markup is not a content requirement

Decision: remove legacy `meta keywords`, homepage `SearchAction`, FAQPage and HowTo search-feature markup where it no longer provides a current Google Search feature benefit, while keeping useful visible FAQ and sizing content.

Reason: useful content remains valuable independently of retired or unsupported rich-result/search-box features.

## D7 — Filter/search states remain discovery states, not accidental landing pages

Decision: preserve `noindex` for filtered/search states and canonicalize to clean indexable routes unless a future SEO landing page is deliberately created with distinct demand/content.

Reason: avoids duplicate/thin competing URLs while preserving user discovery.

## D8 — Visual baseline changes require review, not blind snapshot updates

Decision: the P1.3 category snapshot was updated only after reviewing the actual/diff output and confirming the 64px height change came from the intentional Size Guide link/content delta.

Reason: snapshot acceptance must validate intended UI change rather than hide a regression.
'''
          if '## D4 — Category intent is transactional' not in d:
              decision.write_text(d.rstrip() + extra + '\n')

          Path('docs/P1_3_SEO_CLOSURE.md').write_text('''# LBB P1.3 — SEO Semantic & Content Polish Closure

Status: **IMPLEMENTED / EXACT-HEAD GATED / READY FOR MERGE**

## Identity

- Repository: `sajadkhavas/lbb`
- Base branch: `fix/lbb-local-boutique-homepage`
- START_SHA: `1d6fd9170788e9e765c17fc4b29987b87436d283`
- Phase branch: `phase/p1-3-seo-semantic-content-polish`
- Tracking issue: #61
- PR: #62
- Validated implementation head before closure-document reconciliation: `03875bec5b619239c23aa502f1749447b0b14ed4`
- Production mutation: **NO**

## Accepted scope

1. Evidence-backed keyword/search-intent research.
2. Route-by-route intent mapping.
3. Semantic content reconciliation against approved Business Truth.
4. Local SEO reconciliation without keyword stuffing.
5. Title/meta/H1 strategy reconciliation for important routes.
6. FAQ/structured-data reconciliation.
7. Internal-link/anchor audit and category → Size Guide linking.
8. Canonical/filter/indexation/robots/sitemap verification.
9. Duplicate/thin-content review.
10. SSR/head and dedicated SEO regression verification.
11. Full exact-head project quality gate.

## Final semantic policy

- Home: brand + broad streetwear + factual Karaj/local-store context.
- Contact: strong local/navigation/support intent.
- Shop: broad ecommerce discovery without stale wording.
- Categories: transactional product-family intent; no forced geo or unsupported gender template.
- Product detail: only verified product-specific facts.
- FAQ/Size Guide: useful visible support content retained; retired search-feature markup removed.
- Search/filter states: noindex + clean canonical unless a future deliberate SEO landing page is created.

## Technical/search contracts

- `meta keywords`: removed from the active SEO contract.
- Homepage `SearchAction`: removed.
- FAQPage rich-result markup: removed while FAQ content stays visible.
- HowTo markup: removed while sizing guidance stays visible.
- Breadcrumb structured data retained where appropriate.
- Draft/unverified products remain blocked from unsupported Product/Offer publication.
- Sitemap contains canonical/indexable public URLs only.
- Search/filter state indexation protections remain active.

## QA evidence

- Initial exact-head full gate on `03875bec5b619239c23aa502f1749447b0b14ed4`:
  - Workflow: `Quality gates`
  - Run: `33983418418`
  - Conclusion: **SUCCESS**
- Prior gate `33982992361` reached 289/290 tests and failed only on the intentional category desktop visual delta.
- The category actual/diff was manually reviewed before snapshot acceptance.
- Snapshot acceptance commit changed only `tests/catalog-visual.spec.ts-snapshots/f14-category-desktop-chromium-linux.png`.
- Temporary workflow helpers were removed before the accepted exact-head gate.
- PR review threads before closure: **0 open**.

## Closure gate after documentation reconciliation

This closure registration changes documentation files and therefore moves the PR head. A new complete `Quality gates` run must pass on the final PR head after this helper is removed. Only then may PR #62 merge and issue #61 close.

## NEXT

`P1.4 — Regression QA + Frontend Freeze`
''')
          PY

          git diff --check
          git status --short

      - name: Commit closure registration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LBB_MASTER_HANDOFF_FA.md docs/P1_3_SEO_DECISION_LOG.md docs/P1_3_SEO_CLOSURE.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(seo): register P1.3 closure and P1.4 next"
          git push origin HEAD:phase/p1-3-seo-semantic-content-polish
