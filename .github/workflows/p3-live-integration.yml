name: P3 Live Integration

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface
  pull_request:
    branches:
      - fix/lbb-local-boutique-homepage

permissions:
  contents: read

env:
  VITE_SITE_URL: https://lbb.example.test
  VITE_LBB_BACKEND_MODE: prototype

jobs:
  frontend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format lint and type contract
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Assert P3 live-control invariants
        run: |
          node <<'NODE'
          const fs = require('fs')
          const api = fs.readFileSync('src/lib/backend-api.ts', 'utf8')
          const control = fs.readFileSync('src/lib/storefront-control.tsx', 'utf8')
          const root = fs.readFileSync('src/routes/__root.tsx', 'utf8')
          const home = fs.readFileSync('src/routes/index.tsx', 'utf8')
          if (!api.includes('2026-09-06-p3-storefront-v1')) throw new Error('P3 contract version missing')
          if (!control.includes('source: "prototype"')) throw new Error('Explicit prototype mode missing')
          if (!control.includes('/api/v1/storefront/bootstrap')) throw new Error('Storefront bootstrap consumer missing')
          if (!root.includes('loader: () => resolveStorefrontControl()')) throw new Error('SSR root control loader missing')
          if (!home.includes('getProduct(control.home.heroProductSlug)')) throw new Error('Live hero product consumer missing')
          NODE

  full-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete frozen-baseline quality suite
        run: npm run quality
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
