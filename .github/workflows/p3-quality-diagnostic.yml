name: P3 Final Formatter Cleanup

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[p3-prettier-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format audit and remove temporary diagnostics
        run: |
          npx prettier --write scripts/audit-store-settings.mjs
          rm -f docs/_p3_quality_diagnostic.txt
          rm -f .github/workflows/p3-quality-diagnostic.yml
      - name: Commit clean acceptance tree
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add -A
          git commit -m 'chore(p3): finalize clean acceptance tree'
          git push origin HEAD:phase/p3-live-integration-control-surface
