name: F12 navigation artifact validation

on:
  pull_request:
    branches:
      - validation/f12-global-shell-navigation-os

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f12-global-shell-navigation-os
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic F12 cleanup
        run: |
          python <<'PY'
          from pathlib import Path

          search = Path('src/components/lbb/navigation/SearchOverlay.tsx')
          text = search.read_text()
          old = '${category.nameFa} ${category.nameEn} ${category.description}'
          new = '${category.nameFa} ${category.nameFaPlural} ${category.heroTagline}'
          if old not in text:
              raise SystemExit('Expected SearchOverlay category metadata marker was not found')
          search.write_text(text.replace(old, new))

          for filename in [
              'src/components/lbb/navigation/MegaMenuOverlay.tsx',
              'src/components/lbb/navigation/MobileMenuOverlay.tsx',
          ]:
              path = Path(filename)
              source = path.read_text()
              marker = '{CATEGORIES[slug].nameEn}'
              if marker not in source:
                  raise SystemExit(f'Expected category latin marker was not found in {filename}')
              path.write_text(source.replace(marker, '{slug.toUpperCase()}'))

          quick = Path('src/components/lbb/ProductQuickView.tsx')
          source = quick.read_text()
          source = source.replace(
              'const { product, close } = useQuickView();',
              'const { product, close, dismissForNavigation } = useQuickView();',
          )
          old_handoff = '''    close();
              requestAnimationFrame(() => openDrawer());'''
          if old_handoff not in source:
              old_handoff = '''    close();
    requestAnimationFrame(() => openDrawer());'''
          if old_handoff not in source:
              raise SystemExit('Expected Quick View cart handoff marker was not found')
          source = source.replace(
              old_handoff,
              '''    dismissForNavigation();
    requestAnimationFrame(() => openDrawer());''',
          )
          old_link = '''          <Link
            to="/product/$slug"
            params={{ slug: p.slug }}
            onClick={close}'''
          new_link = '''          <Link
            to="/product/$slug"
            params={{ slug: p.slug }}
            onClick={dismissForNavigation}'''
          if old_link not in source:
              raise SystemExit('Expected Quick View product link marker was not found')
          quick.write_text(source.replace(old_link, new_link))
          PY

      - name: Format F12 scope
        run: |
          npx prettier --write \
            src/lib/navigation.ts \
            src/lib/overlay-history.ts \
            src/lib/navigation-overlay.tsx \
            src/lib/cart.tsx \
            src/lib/quickview.tsx \
            src/components/lbb/Navbar.tsx \
            src/components/lbb/Footer.tsx \
            src/components/lbb/MobileBottomBar.tsx \
            src/components/lbb/AnnouncementBar.tsx \
            src/components/lbb/Breadcrumb.tsx \
            src/components/lbb/CartDrawer.tsx \
            src/components/lbb/ProductQuickView.tsx \
            src/components/lbb/GlobalPageState.tsx \
            src/components/lbb/navigation \
            src/routes/__root.tsx \
            src/routes/account.tsx \
            tests/all-routes.spec.ts \
            tests/accessibility.spec.ts \
            tests/navigation-shell.spec.ts \
            tests/visual.spec.ts \
            docs/f12

      - name: Build and generate typed route tree
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Commit generated F12 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/navigation.ts \
            src/lib/overlay-history.ts \
            src/lib/navigation-overlay.tsx \
            src/lib/cart.tsx \
            src/lib/quickview.tsx \
            src/components/lbb/Navbar.tsx \
            src/components/lbb/Footer.tsx \
            src/components/lbb/MobileBottomBar.tsx \
            src/components/lbb/AnnouncementBar.tsx \
            src/components/lbb/Breadcrumb.tsx \
            src/components/lbb/CartDrawer.tsx \
            src/components/lbb/ProductQuickView.tsx \
            src/components/lbb/GlobalPageState.tsx \
            src/components/lbb/navigation \
            src/routes/__root.tsx \
            src/routes/account.tsx \
            src/routeTree.gen.ts \
            tests/all-routes.spec.ts \
            tests/accessibility.spec.ts \
            tests/navigation-shell.spec.ts \
            tests/visual.spec.ts \
            tests/visual.spec.ts-snapshots \
            docs/f12
          if ! git diff --cached --quiet; then
            git commit -m 'test(f12): register navigation route and visual artifacts'
            git push origin HEAD:phase/f12-global-shell-navigation-os
          fi

      - name: Run complete immutable quality suite
        run: npm run quality

      - name: Verify tracked files remain stable
        run: git diff --exit-code -- . ':(exclude)playwright-report' ':(exclude)test-results'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f12-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
