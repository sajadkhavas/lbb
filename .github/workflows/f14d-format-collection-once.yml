name: F14D Format Collection Once

on:
  push:
    branches:
      - phase/f14d-production-backend-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/f14d-production-backend-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/routes/collections.$slug.tsx'
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/collections.$slug.tsx'
          git commit -m 'F14D: format backend collection detail'
          git push origin HEAD:phase/f14d-production-backend-integration
