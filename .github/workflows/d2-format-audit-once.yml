name: D2 audit format once

on:
  push:
    branches:
      - phase/p4-act-content-legal-d2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/p4-act-content-legal-d2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format audit remediation
        run: npx prettier --write scripts/audit-brand-copy.mjs tests/p4-content-legal-d2.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "NO_FORMAT_CHANGES=YES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-brand-copy.mjs tests/p4-content-legal-d2.spec.ts
          git commit -m "style(d2): format audit remediation"
          git push origin HEAD:phase/p4-act-content-legal-d2
