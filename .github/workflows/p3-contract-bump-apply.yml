name: P3 Frontend One-shot Patch

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-finalize-pages]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format and typecheck final public pages
        run: |
          npx prettier --write src/routes/contact.tsx src/routes/about.tsx
          npm run typecheck
      - name: Commit tested formatting
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add src/routes/contact.tsx src/routes/about.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'style(p3): format final backend-authoritative pages'
          git push origin HEAD:phase/p3-live-integration-control-surface
