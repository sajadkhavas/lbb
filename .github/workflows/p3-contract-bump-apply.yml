name: P3 Frontend One-shot Patch

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-source-live]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Normalize live storefront source name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/storefront-control.tsx')
          text = path.read_text()
          text = text.replace('source: "prototype" | "backend";', 'source: "prototype" | "live";')
          text = text.replace('source: "backend",', 'source: "live",')
          path.write_text(text)
          PY
      - run: npm ci
      - name: Format and typecheck
        run: |
          npx prettier --write src/lib/storefront-control.tsx src/routes/__root.tsx src/routes/index.tsx src/components/lbb/AnnouncementBar.tsx src/components/lbb/BrandIntro.tsx src/components/lbb/Navbar.tsx src/components/lbb/Footer.tsx src/components/lbb/home/HeroNarrative.tsx src/components/lbb/navigation/MerchantNavigationLink.tsx src/components/lbb/navigation/MegaMenuOverlay.tsx src/components/lbb/navigation/MobileMenuOverlay.tsx
          npm run typecheck
      - name: Commit tested normalization and formatting
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p3): normalize live storefront source'
          git push origin HEAD:phase/p3-live-integration-control-surface
