name: P3 Frontend One-shot Patch

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-journal-live]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Wire versioned Journal index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/journal.index.tsx')
          text = path.read_text()
          marker = 'import { absUrl, breadcrumbLd, canonical, pageMeta } from "@/lib/site";\n'
          addition = marker + 'import { resolveStorefrontJournal, type StorefrontJournalDto } from "@/lib/storefront-control";\n'
          if 'resolveStorefrontJournal' not in text:
              if marker not in text: raise SystemExit('Journal import marker missing')
              text = text.replace(marker, addition, 1)

          route_marker = 'export const Route = createFileRoute("/journal/")({\n'
          if 'loader: () => resolveStorefrontJournal(),' not in text:
              if route_marker not in text: raise SystemExit('Journal route marker missing')
              text = text.replace(route_marker, route_marker + '  loader: () => resolveStorefrontJournal(),\n', 1)

          text = text.replace('  head: () => {\n    const itemListLd = {', '  head: ({ loaderData }) => {\n    const indexArticles = loaderData ?? JOURNAL_ARTICLES;\n    const itemListLd = {', 1)
          text = text.replace('numberOfItems: JOURNAL_ARTICLES.length,', 'numberOfItems: indexArticles.length,', 1)
          text = text.replace('itemListElement: JOURNAL_ARTICLES.map((article, index) => ({', 'itemListElement: indexArticles.map((article, index) => ({', 1)

          if 'function PrototypeJournalIndexPage()' not in text:
              old = 'function JournalIndexPage() {\n  const [featured, ...articles] = JOURNAL_ARTICLES;'
              new = 'function PrototypeJournalIndexPage() {\n  const [featured, ...articles] = JOURNAL_ARTICLES;'
              if old not in text: raise SystemExit('Journal component marker missing')
              text = text.replace(old, new, 1)

          live = '''\nfunction JournalIndexPage() {\n  const liveArticles = Route.useLoaderData();\n  return liveArticles ? (\n    <LiveJournalIndexPage articles={liveArticles} />\n  ) : (\n    <PrototypeJournalIndexPage />\n  );\n}\n\nfunction LiveJournalIndexPage({ articles }: { articles: StorefrontJournalDto[] }) {\n  return (\n    <>\n      <Navbar theme="light" />\n      <main className="min-h-screen bg-obsidian pb-bottombar pt-16" data-f17-route="journal" data-storefront-source="live">\n        <Shell className="py-3">\n          <Breadcrumb items={[{ label: "خانه", href: "/" }, { label: "ژورنال" }]} />\n        </Shell>\n        <Band hairline={false} className="pb-8 pt-8 md:pb-12 md:pt-12">\n          <Shell>\n            <TechLabel tone="signal">LBB / EDITORIAL NOTES</TechLabel>\n            <h1 className="mt-5 max-w-[15ch] text-display-1 text-bone">ژورنال؛ راهنماها و یادداشت‌های منتشرشده LBB</h1>\n            <p className="text-lede mt-5 max-w-[62ch]">فهرست این صفحه مستقیماً از محتوای منتشرشده در Backend می‌آید.</p>\n          </Shell>\n        </Band>\n        <Band>\n          <Shell>\n            {articles.length === 0 ? (\n              <div className="rounded-2xl border border-hairline bg-carbon p-8 text-center text-metal">هنوز مقاله‌ای منتشر نشده است.</div>\n            ) : (\n              <div className="grid grid-cols-1 gap-5 md:grid-cols-2">\n                {articles.map((article, index) => (\n                  <article key={article.publicId || article.slug} className="overflow-hidden rounded-2xl border border-hairline bg-carbon">\n                    {article.coverUrl ? <img src={article.coverUrl} alt="" width={960} height={640} loading={index < 2 ? "eager" : "lazy"} className="aspect-[3/2] w-full object-cover" /> : null}\n                    <div className="p-6">\n                      <TechLabel tone="signal">{article.category ?? "JOURNAL"}</TechLabel>\n                      <h2 className="mt-3 text-display-3 text-bone">{article.title}</h2>\n                      {article.excerpt ? <p className="mt-3 text-sm leading-8 text-metal">{article.excerpt}</p> : null}\n                      <div className="mt-5 flex flex-wrap items-center justify-between gap-3">\n                        {article.publishedAt ? <time dateTime={article.publishedAt} className="text-xs text-mute">{new Intl.DateTimeFormat("fa-IR", { dateStyle: "long" }).format(new Date(article.publishedAt))}</time> : <span />}\n                        <Link to="/journal/$slug" params={{ slug: article.slug }} className={CtaClasses("line", "sm")}>خواندن مقاله <ArrowUpLeft size={15} aria-hidden="true" /></Link>\n                      </div>\n                    </div>\n                  </article>\n                ))}\n              </div>\n            )}\n          </Shell>\n        </Band>\n      </main>\n      <Footer theme="light" />\n      <MobileBottomBar />\n    </>\n  );\n}\n\n'''
          if 'function LiveJournalIndexPage' not in text:
              marker2 = 'function PrototypeJournalIndexPage() {'
              if marker2 not in text: raise SystemExit('Prototype Journal marker missing')
              text = text.replace(marker2, live + marker2, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Format and typecheck
        run: |
          npx prettier --write src/routes/journal.index.tsx
          npm run typecheck
      - name: Commit tested Journal index cut-over
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add src/routes/journal.index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p3): consume backend Journal index'
          git push origin HEAD:phase/p3-live-integration-control-surface
