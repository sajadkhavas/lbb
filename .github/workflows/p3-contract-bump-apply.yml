name: P3 Frontend One-shot Patch

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-lookbook-live]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Wire versioned Lookbook content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/lookbook.tsx')
          text = path.read_text()
          marker = 'import { pageMeta, canonical, breadcrumbLd } from "@/lib/site";\n'
          addition = marker + 'import { resolveStorefrontLookbook, type StorefrontLookDto } from "@/lib/storefront-control";\n'
          if 'resolveStorefrontLookbook' not in text:
              if marker not in text: raise SystemExit('Lookbook import marker missing')
              text = text.replace(marker, addition, 1)

          route_marker = 'export const Route = createFileRoute("/lookbook")({\n'
          if 'loader: () => resolveStorefrontLookbook(),' not in text:
              if route_marker not in text: raise SystemExit('Lookbook route marker missing')
              text = text.replace(route_marker, route_marker + '  loader: () => resolveStorefrontLookbook(),\n', 1)

          if 'function PrototypeLookbookPage()' not in text:
              old = 'function LookbookPage() {\n  const sceneViews = useMemo(() => LOOKBOOK_SCENES.map(getLookbookSceneView), []);'
              new = 'function PrototypeLookbookPage() {\n  const sceneViews = useMemo(() => LOOKBOOK_SCENES.map(getLookbookSceneView), []);'
              if old not in text: raise SystemExit('Lookbook component marker missing')
              text = text.replace(old, new, 1)

          live = '''\nfunction LookbookPage() {\n  const liveItems = Route.useLoaderData();\n  return liveItems ? <LiveLookbookPage items={liveItems} /> : <PrototypeLookbookPage />;\n}\n\nfunction LiveLookbookPage({ items }: { items: StorefrontLookDto[] }) {\n  return (\n    <>\n      <Navbar theme="light" />\n      <main className="min-h-screen bg-obsidian pb-bottombar pt-16" data-f17-route="lookbook" data-storefront-source="live">\n        <Shell className="py-3">\n          <Breadcrumb items={[{ label: "خانه", href: "/" }, { label: "لوک‌بوک" }]} />\n        </Shell>\n        <Band hairline={false} className="pb-8 pt-8 md:pb-12 md:pt-12">\n          <Shell>\n            <TechLabel tone="signal">LBB / VISUAL STORIES</TechLabel>\n            <h1 className="mt-5 max-w-[15ch] text-display-1 text-bone">لوک‌بوک؛ داستان‌های تصویری LBB</h1>\n            <p className="text-lede mt-5 max-w-[60ch]">تصاویر و مسیرهای این صفحه مستقیماً از محتوای منتشرشده فروشگاه می‌آیند.</p>\n          </Shell>\n        </Band>\n        <Band>\n          <Shell>\n            {items.length === 0 ? (\n              <StatePanel title="هنوز تصویری برای لوک‌بوک منتشر نشده است">پس از انتشار در پنل مدیریت، تصاویر اینجا نمایش داده می‌شوند.</StatePanel>\n            ) : (\n              <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">\n                {items.map((item, index) => (\n                  <article key={`${item.imageUrl}-${index}`} className="overflow-hidden rounded-2xl border border-hairline bg-carbon">\n                    <figure>\n                      <img src={item.imageUrl} alt={item.title} width={900} height={1125} loading={index < 2 ? "eager" : "lazy"} className="aspect-[4/5] w-full object-cover" />\n                      <figcaption className="p-4">\n                        <TechLabel tone="signal">LOOK {String(index + 1).padStart(2, "0")}</TechLabel>\n                        <h2 className="mt-2 text-display-3 text-bone">{item.title}</h2>\n                        {item.caption ? <p className="mt-2 text-sm leading-7 text-metal">{item.caption}</p> : null}\n                        {item.linkUrl ? (\n                          <a href={item.linkUrl} className={`${CtaClasses("line", "sm")} mt-4`}>مسیر مرتبط <ArrowUpLeft size={15} aria-hidden="true" /></a>\n                        ) : null}\n                      </figcaption>\n                    </figure>\n                  </article>\n                ))}\n              </div>\n            )}\n          </Shell>\n        </Band>\n      </main>\n      <Footer theme="light" />\n      <MobileBottomBar />\n    </>\n  );\n}\n\n'''
          if 'function LiveLookbookPage' not in text:
              marker2 = 'function PrototypeLookbookPage() {'
              if marker2 not in text: raise SystemExit('Prototype Lookbook marker missing')
              text = text.replace(marker2, live + marker2, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Format and typecheck
        run: |
          npx prettier --write src/routes/lookbook.tsx
          npm run typecheck
      - name: Commit tested Lookbook cut-over
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add src/routes/lookbook.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p3): consume backend Lookbook content'
          git push origin HEAD:phase/p3-live-integration-control-surface
