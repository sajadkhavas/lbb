name: P3 Frontend Contract Bump Apply

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-contract-bump]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply P3 contract version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/backend-api.ts')
          text = path.read_text()
          old = 'export const LBB_CONTRACT_VERSION = "2026-08-09-f14-be-f1" as const;'
          new = 'export const LBB_CONTRACT_VERSION = "2026-09-06-p3-storefront-v1" as const;'
          if old not in text:
              raise SystemExit('expected contract marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Contract typecheck
        run: npm run typecheck
      - name: Commit tested contract bump
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add src/lib/backend-api.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p3): adopt storefront contract version'
          git push origin HEAD:phase/p3-live-integration-control-surface
