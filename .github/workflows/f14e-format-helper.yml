name: F14E format helper

on:
  pull_request:
    branches:
      - phase/f14c-production-content-product-data

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'phase/f14e-trust-legal-support'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format F14E files
        run: >-
          npx prettier --write
          scripts/audit-store-settings.mjs
          src/components/lbb/TrustMarks.tsx
          src/lib/commerce.ts
          src/lib/store-settings.ts
          src/routes/cart.tsx
          src/routes/checkout.tsx
          src/routes/contact.tsx
          src/routes/order-confirmation.tsx
          src/routes/privacy.tsx
          src/routes/shipping-returns.tsx
          src/routes/terms.tsx
          src/routes/track-order.tsx
          tests/trust-legal-support.spec.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/audit-store-settings.mjs \
            src/components/lbb/TrustMarks.tsx \
            src/lib/commerce.ts \
            src/lib/store-settings.ts \
            src/routes/cart.tsx \
            src/routes/checkout.tsx \
            src/routes/contact.tsx \
            src/routes/order-confirmation.tsx \
            src/routes/privacy.tsx \
            src/routes/shipping-returns.tsx \
            src/routes/terms.tsx \
            src/routes/track-order.tsx \
            tests/trust-legal-support.spec.ts
          git commit -m "chore: format F14E files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
