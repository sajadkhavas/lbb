name: F20B Apply Production SEO Source V2

on:
  push:
    branches:
      - phase/f20b-production-seo-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f20b-production-seo-integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed F20-B patch
        shell: bash
        run: |
          awk '
            /python3 <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/f20b-apply-source.yml > /tmp/f20b-apply.py
          python3 /tmp/f20b-apply.py
          git checkout HEAD -- .github/workflows
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed source
        run: npx prettier --write src/lib/seo-live.ts 'src/routes/product.$slug.tsx' 'src/routes/$category.tsx' 'src/routes/collections.$slug.tsx' 'src/routes/sitemap[.]xml.ts' tests/f20b-seo-helpers.spec.ts scripts/audit-f20b-seo.mjs docs/f20/f20b-completion.md package.json
      - name: Lint
        run: npm run lint
      - name: Build before typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run build
      - name: Typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run typecheck
      - name: F20-B source audit
        run: npm run audit:f20b
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Existing SEO regressions
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run test:seo
      - name: F20-B helper regressions
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run test:f20b
      - name: Commit validated F20-B source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs/f20 package.json
          git diff --cached --quiet && { echo "No F20-B source changes"; exit 1; }
          git commit -m "feat(f20b): integrate production SEO data"
          git push origin HEAD:phase/f20b-production-seo-integration
