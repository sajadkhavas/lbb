name: P4 E1 Prettier Refresh

on:
  push:
    branches:
      - fix/lbb-seo-final-e1
    paths:
      - .github/workflows/p4-e1-prettier-refresh.yml

permissions:
  contents: write

jobs:
  format-e1-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lbb-seo-final-e1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format only E1 test with locked Prettier
        run: |
          npx prettier --write tests/p4-seo-final-e1.spec.ts
          npx prettier --check tests/p4-seo-final-e1.spec.ts

      - name: Commit deterministic formatting
        run: |
          test -n "$(git status --porcelain -- tests/p4-seo-final-e1.spec.ts)"
          git diff -- tests/p4-seo-final-e1.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/p4-seo-final-e1.spec.ts
          git commit -m 'style: apply locked Prettier to E1 test'
          git push origin HEAD:fix/lbb-seo-final-e1
