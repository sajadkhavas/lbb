name: Inspect TypeScript native gate

on:
  push:
    branches:
      - phase/f8-quality-foundation
    paths:
      - .github/workflows/inspect-tsgo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Resolve current native preview version
        run: npm view @typescript/native-preview version
      - name: Run original baseline typecheck command
        env:
          VITE_SITE_URL: https://lbb.test
        run: npx --yes --package=@typescript/native-preview tsgo --noEmit
