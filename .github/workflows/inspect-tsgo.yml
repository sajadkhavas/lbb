name: Restore TypeScript native gate

on:
  push:
    branches:
      - phase/f8-quality-foundation
    paths:
      - .github/workflows/inspect-tsgo.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-tsgo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-tsgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase/f8-quality-foundation

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Add the official native TypeScript preview
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --save-dev --save-exact @typescript/native-preview@latest --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          packageJson.scripts.typecheck = 'tsgo --noEmit'
          writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Prove npm ci and original typecheck gate
        env:
          VITE_SITE_URL: https://lbb.test
        run: |
          validated=false
          for attempt in 1 2 3; do
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if npm ci --ignore-scripts --no-audit --no-fund; then
              validated=true
              break
            fi
          done
          if [ "$validated" != "true" ]; then
            echo "npm ci did not accept the updated lockfile."
            exit 1
          fi
          native_version=$(node -e "console.log(require('./node_modules/@typescript/native-preview/package.json').version)")
          echo "Resolved native preview: ${native_version}"
          npm run typecheck

      - name: Commit validated dependency on latest head
        run: |
          cp package.json /tmp/lbb-package.json
          cp package-lock.json /tmp/lbb-package-lock.json
          git fetch origin phase/f8-quality-foundation
          git reset --hard origin/phase/f8-quality-foundation
          cp /tmp/lbb-package.json package.json
          cp /tmp/lbb-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(quality): restore native TypeScript gate"
          git push origin HEAD:phase/f8-quality-foundation
