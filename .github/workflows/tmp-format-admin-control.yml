name: Temporary Admin Control Formatter

on:
  push:
    branches:
      - maintenance/final-admin-control-completion-20260910

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/final-admin-control-completion-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format exact failing files
        run: |
          npx prettier --write \
            scripts/audit-admin-control-completion.mjs \
            src/components/lbb/Footer.tsx \
            src/components/lbb/home/CategoryGateway.tsx \
            src/components/lbb/home/DropStory.tsx \
            src/components/lbb/home/HeroNarrative.tsx \
            src/components/lbb/home/ProductMoments.tsx \
            src/lib/storefront-presentation.tsx \
            src/routes/collections.index.tsx \
            src/routes/faq.tsx \
            src/routes/index.tsx \
            'src/routes/journal.$slug.tsx' \
            src/routes/shop.tsx

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo 'FORMAT_CHANGES=NO'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/audit-admin-control-completion.mjs \
            src/components/lbb/Footer.tsx \
            src/components/lbb/home/CategoryGateway.tsx \
            src/components/lbb/home/DropStory.tsx \
            src/components/lbb/home/HeroNarrative.tsx \
            src/components/lbb/home/ProductMoments.tsx \
            src/lib/storefront-presentation.tsx \
            src/routes/collections.index.tsx \
            src/routes/faq.tsx \
            src/routes/index.tsx \
            'src/routes/journal.$slug.tsx' \
            src/routes/shop.tsx
          git diff --cached --check
          git commit -m 'style: apply Prettier to admin-control delta'
          git push origin HEAD:maintenance/final-admin-control-completion-20260910
