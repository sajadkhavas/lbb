name: P4 E1 npm Lock Refresh

on:
  push:
    branches:
      - fix/lbb-seo-final-e1
    paths:
      - .github/workflows/p4-e1-npm-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lbb-seo-final-e1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh only js-yaml within existing ranges
        run: |
          npm update js-yaml --package-lock-only --ignore-scripts
          node -e "const p=require('./package-lock.json').packages['node_modules/js-yaml']; console.log('JS_YAML_VERSION='+p.version)"
          npm audit --omit=dev --audit-level=high

      - name: Commit deterministic lock refresh
        run: |
          test -n "$(git status --porcelain -- package-lock.json)"
          git diff -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh js-yaml to patched release'
          git push origin HEAD:fix/lbb-seo-final-e1
