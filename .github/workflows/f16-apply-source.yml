name: F16 Apply Source Atomically

on:
  push:
    branches:
      - phase/f16-cart-commerce-continuity

permissions:
  contents: write

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f16-cart-commerce-continuity
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract and apply reviewed F16 source patch
        shell: bash
        run: |
          awk '
            /python3 <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/f16-apply.yml > /tmp/f16-apply.py
          python3 /tmp/f16-apply.py
          python3 -c "from pathlib import Path; p=Path('tests/f16-commerce-continuity.spec.ts'); p.write_text(p.read_text().replace('سبد خرید خالی است', 'سبد خرید شما خالی است'), encoding='utf-8')"
          git checkout HEAD -- .github/workflows
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed source
        run: npx prettier --write src/lib/cart.tsx src/lib/checkout-continuity.ts src/routes/checkout.tsx src/routes/payment.result.tsx tests/f16-commerce-continuity.spec.ts scripts/audit-f16-continuity.mjs docs/f16/README.md package.json
      - name: Lint
        run: npm run lint
      - name: Build live mode before typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run build
      - name: Typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run typecheck
      - name: Preserve F14D contract
        run: node scripts/audit-f14d-integration.mjs
      - name: F16 continuity audit
        run: npm run audit:f16
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: F16 browser continuity tests
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run test:f16
      - name: Commit only validated F16 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cart.tsx src/lib/checkout-continuity.ts src/routes/checkout.tsx src/routes/payment.result.tsx tests/f16-commerce-continuity.spec.ts scripts/audit-f16-continuity.mjs docs/f16/README.md package.json src/routeTree.gen.ts
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "feat(f16): harden cart and checkout continuity"
          git push origin HEAD:phase/f16-cart-commerce-continuity
