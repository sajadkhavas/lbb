name: D2 sanitize shipping hydration once

on:
  push:
    branches:
      - hotfix/p4-d2-sanitize-shipping-hydration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/p4-d2-sanitize-shipping-hydration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/d2-sanitize-shipping-hydration-once.mjs
      - run: npm ci
      - name: Format and focused validation
        run: |
          npx prettier --write src/routes/shipping-returns.tsx tests/p4-content-legal-d2.spec.ts
          npm run format:check
          npm run lint
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test tests/p4-content-legal-d2.spec.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/shipping-returns.tsx tests/p4-content-legal-d2.spec.ts
          git commit -m "fix(d2): sanitize shipping loader hydration payload"
          git push origin HEAD:hotfix/p4-d2-sanitize-shipping-hydration
