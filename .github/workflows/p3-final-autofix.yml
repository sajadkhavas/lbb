name: P3 Final One-shot Autofix

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[p3-autofix]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic formatter and ESLint fixes
        run: |
          npx prettier --write .
          npx eslint . --fix || true
          npx prettier --write .
          npm run typecheck
      - name: Commit deterministic fixes
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style(p3): apply deterministic repository formatting'
          git push origin HEAD:phase/p3-live-integration-control-surface
