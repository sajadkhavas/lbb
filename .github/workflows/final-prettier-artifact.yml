name: Final Prettier Apply

on:
  push:
    branches:
      - feature/final-technical-completion

permissions:
  contents: write

jobs:
  apply-format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-technical-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write \
            src/components/lbb/AccountStorefrontSync.tsx \
            src/components/lbb/home/CategoryGateway.tsx \
            src/components/lbb/home/HeroNarrative.tsx \
            src/components/lbb/home/ProductMoments.tsx \
            src/components/lbb/InstagramStrip.tsx \
            src/components/lbb/navigation/CatalogTaxonomyMenu.tsx \
            src/components/lbb/ProductCard.tsx \
            src/routes/contact.tsx \
            src/routes/index.tsx \
            src/routes/track-order.tsx
      - name: Verify exact formatting
        run: |
          npx prettier --check \
            src/components/lbb/AccountStorefrontSync.tsx \
            src/components/lbb/home/CategoryGateway.tsx \
            src/components/lbb/home/HeroNarrative.tsx \
            src/components/lbb/home/ProductMoments.tsx \
            src/components/lbb/InstagramStrip.tsx \
            src/components/lbb/navigation/CatalogTaxonomyMenu.tsx \
            src/components/lbb/ProductCard.tsx \
            src/routes/contact.tsx \
            src/routes/index.tsx \
            src/routes/track-order.tsx
      - name: Commit formatted sources and remove temporary workflow
        run: |
          git rm .github/workflows/final-prettier-artifact.yml
          git add \
            src/components/lbb/AccountStorefrontSync.tsx \
            src/components/lbb/home/CategoryGateway.tsx \
            src/components/lbb/home/HeroNarrative.tsx \
            src/components/lbb/home/ProductMoments.tsx \
            src/components/lbb/InstagramStrip.tsx \
            src/components/lbb/navigation/CatalogTaxonomyMenu.tsx \
            src/components/lbb/ProductCard.tsx \
            src/routes/contact.tsx \
            src/routes/index.tsx \
            src/routes/track-order.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply exact Prettier output [prettier-applied]"
          git push origin HEAD:feature/final-technical-completion
