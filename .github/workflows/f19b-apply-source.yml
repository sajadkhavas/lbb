name: F19B Apply Remediation Source

on:
  push:
    branches:
      - phase/f19b-accessibility-rtl-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f19b-accessibility-rtl-remediation
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply F19-B remediation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Shared bidi-safe identifier primitive.
          Path('src/components/lbb/ui/Identifier.tsx').write_text('''import type { ReactNode } from "react";\nimport { cn } from "@/lib/utils";\n\nexport function Identifier({ children, className }: { children: ReactNode; className?: string }) {\n  return (\n    <bdi dir="ltr" className={cn("num inline-block unicode-bidi-isolate", className)}>\n      {children}\n    </bdi>\n  );\n}\n''', encoding='utf-8')

          # PDP gallery: real RTL track + geometry-based active index, no raw RTL scrollLeft dependency.
          p = Path('src/components/lbb/product/Gallery.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''    const track = trackRef.current;\n    const child = track?.children.item(clamped) as HTMLElement | null;\n    if (track && child) track.scrollTo({ left: child.offsetLeft, behavior });''', '''    const track = trackRef.current;\n    const child = track?.children.item(clamped) as HTMLElement | null;\n    if (track && child) {\n      child.scrollIntoView({ behavior, block: "nearest", inline: "center" });\n    }''')
          text = text.replace('''    const centers = Array.from(track.children).map((child) => {\n      const element = child as HTMLElement;\n      return Math.abs(element.offsetLeft - track.scrollLeft);\n    });''', '''    const trackRect = track.getBoundingClientRect();\n    const trackCenter = trackRect.left + trackRect.width / 2;\n    const centers = Array.from(track.children).map((child) => {\n      const rect = (child as HTMLElement).getBoundingClientRect();\n      return Math.abs(rect.left + rect.width / 2 - trackCenter);\n    });''')
          text = text.replace('''          dir="ltr"\n          ref={trackRef}''', '''          dir="rtl"\n          ref={trackRef}''')
          p.write_text(text, encoding='utf-8')

          # Quick View touch targets, RTL keyboard contract, bidi-safe SKU.
          p = Path('src/components/lbb/ProductQuickView.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''import { CtaClasses, StatusTag, TechLabel } from "@/components/lbb/ui/primitives";''', '''import { CtaClasses, StatusTag, TechLabel } from "@/components/lbb/ui/primitives";\nimport { Identifier } from "@/components/lbb/ui/Identifier";''')
          text = text.replace('''            className="relative aspect-[4/3] w-full overflow-hidden bg-carbon touch-pan-y md:aspect-[3/4] md:h-full"\n            onTouchStart''', '''            className="relative aspect-[4/3] w-full overflow-hidden bg-carbon touch-pan-y md:aspect-[3/4] md:h-full"\n            tabIndex={gallery.length > 1 ? 0 : -1}\n            role="region"\n            aria-label={`گالری نمای سریع ${p.name}`}\n            onKeyDown={(event) => {\n              if (gallery.length <= 1) return;\n              if (event.key === "ArrowLeft") {\n                event.preventDefault();\n                setImage(img + 1);\n              } else if (event.key === "ArrowRight") {\n                event.preventDefault();\n                setImage(img - 1);\n              } else if (event.key === "Home") {\n                event.preventDefault();\n                setImg(0);\n              } else if (event.key === "End") {\n                event.preventDefault();\n                setImg(gallery.length - 1);\n              }\n            }}\n            onTouchStart''')
          text = text.replace('''className={`h-11 w-9 overflow-hidden border-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-signal ${''', '''className={`h-11 w-11 overflow-hidden border-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-signal ${''')
          text = text.replace('''            کد کالا: <span className="num">{p.sku}</span> — جنس: {p.material}''', '''            کد کالا: <Identifier>{p.sku}</Identifier> — جنس: {p.material}''')
          p.write_text(text, encoding='utf-8')

          # Cart drawer target sizes.
          p = Path('src/components/lbb/CartDrawer.tsx')
          text = p.read_text(encoding='utf-8').replace('className="grid h-9 w-9 place-items-center', 'className="grid h-11 w-11 place-items-center')
          p.write_text(text, encoding='utf-8')

          # Active filters / reset targets.
          p = Path('src/components/lbb/ProductGridControls.tsx')
          text = p.read_text(encoding='utf-8').replace('className="flex min-h-10 items-center', 'className="flex min-h-11 items-center')
          text = text.replace('className="min-h-10 tech text-signal', 'className="min-h-11 inline-flex items-center tech text-signal')
          text = text.replace('className="min-h-10 text-xs text-signal', 'className="min-h-11 inline-flex items-center text-xs text-signal')
          p.write_text(text, encoding='utf-8')

          # Shared CTA small size now honors the 44px project target.
          p = Path('src/components/lbb/ui/primitives.tsx')
          text = p.read_text(encoding='utf-8').replace('sm: "min-h-10 px-4', 'sm: "min-h-11 px-4')
          p.write_text(text, encoding='utf-8')

          # FAQ chips and root 404 route chips.
          p = Path('src/routes/faq.tsx')
          text = p.read_text(encoding='utf-8').replace('className="rounded-full border border-hairline px-4 py-2 text-xs', 'className="inline-flex min-h-11 items-center rounded-full border border-hairline px-4 py-2 text-xs')
          p.write_text(text, encoding='utf-8')
          p = Path('src/routes/__root.tsx')
          text = p.read_text(encoding='utf-8').replace('className="rounded-xl border border-hairline px-4 py-2 text-xs', 'className="inline-flex min-h-11 items-center rounded-xl border border-hairline px-4 py-2 text-xs')
          p.write_text(text, encoding='utf-8')

          # SKU identifier consistency.
          p = Path('src/components/lbb/product/ProductFacts.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''import type { ProductDecisionViewModel } from "@/lib/product-decision";''', '''import type { ProductDecisionViewModel } from "@/lib/product-decision";\nimport { Identifier } from "@/components/lbb/ui/Identifier";''')
          text = text.replace('''                <dd className="num mt-1 font-semibold text-bone" dir="ltr">\n                  {model.identity.sku}\n                </dd>''', '''                <dd className="mt-1 font-semibold text-bone">\n                  <Identifier>{model.identity.sku}</Identifier>\n                </dd>''')
          p.write_text(text, encoding='utf-8')

          # Product card screen-reader color semantics.
          p = Path('src/components/lbb/ProductCard.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''import { isLiveBackend } from "@/lib/backend-api";''', '''import { isLiveBackend } from "@/lib/backend-api";\nimport { colorName } from "@/lib/color-names";''')
          old = '''        <div role="group" className="mt-1 flex gap-1.5" aria-label={`${p.colors.length} رنگ موجود`}>'''
          new = '''        <div\n          role="group"\n          className="mt-1 flex gap-1.5"\n          aria-label={`رنگ‌های موجود: ${\n            backend ? p.colors.map((color) => color.name).join("، ") : p.colors.map(colorName).join("، ")\n          }`}\n        >'''
          if old not in text: raise SystemExit('ProductCard color group anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''                  aria-label={color.name}\n                />''', '''                  aria-hidden="true"\n                />''')
          p.write_text(text, encoding='utf-8')

          # Checkout custom validation + field association/focus management.
          p = Path('src/routes/checkout.tsx')
          text = p.read_text(encoding='utf-8')
          marker = 'function LiveCheckout() {'
          types = '''type RecipientFieldKey = "name" | "province" | "city" | "address";\ntype RecipientErrors = Partial<Record<RecipientFieldKey, string>>;\n\n'''
          if types not in text:
              text = text.replace(marker, types + marker, 1)
          text = text.replace('''  const [recoveryError, setRecoveryError] = useState<string | null>(null);''', '''  const [recoveryError, setRecoveryError] = useState<string | null>(null);\n  const [fieldErrors, setFieldErrors] = useState<RecipientErrors>({});''')
          old_ready = '''  const recipientReady =\n    fullName.trim().length >= 2 &&\n    Boolean(customer?.mobile) &&\n    Boolean(deliveryMethod) &&\n    (!needsAddress || (province.trim() && city.trim() && address.trim()));\n  const shouldRecoverPending = lines.length === 0 && Boolean(continuity);'''
          validation = '''  const shouldRecoverPending = lines.length === 0 && Boolean(continuity);\n\n  const clearFieldError = (field: RecipientFieldKey) => {\n    setFieldErrors((current) => {\n      if (!current[field]) return current;\n      const next = { ...current };\n      delete next[field];\n      return next;\n    });\n  };\n\n  const validateRecipient = () => {\n    const next: RecipientErrors = {};\n    if (fullName.trim().length < 2) next.name = "نام و نام خانوادگی را کامل وارد کنید.";\n    if (needsAddress && !province.trim()) next.province = "استان را وارد کنید.";\n    if (needsAddress && !city.trim()) next.city = "شهر را وارد کنید.";\n    if (needsAddress && !address.trim()) next.address = "نشانی کامل را وارد کنید.";\n    setFieldErrors(next);\n    const first = (["name", "province", "city", "address"] as RecipientFieldKey[]).find(\n      (field) => next[field],\n    );\n    if (first) {\n      requestAnimationFrame(() => document.getElementById(`co-${first}`)?.focus());\n      return false;\n    }\n    return true;\n  };'''
          if old_ready not in text: raise SystemExit('checkout recipientReady anchor missing')
          text = text.replace(old_ready, validation, 1)
          text = text.replace('''    if (!customer || !cartCompatible || !recipientReady || !deliveryMethod) return;''', '''    if (!customer || !cartCompatible || !deliveryMethod) return;\n    if (!validateRecipient()) return;''')

          replacements = {
          '''              <Field\n                label="نام و نام خانوادگی"\n                value={fullName}\n                onChange={setFullName}\n                autoComplete="name"\n                required\n              />''': '''              <Field\n                id="co-name"\n                label="نام و نام خانوادگی"\n                value={fullName}\n                onChange={(value) => {\n                  setFullName(value);\n                  clearFieldError("name");\n                }}\n                autoComplete="name"\n                required\n                error={fieldErrors.name}\n              />''',
          '''              <Field label="شماره موبایل تأییدشده" value={customer.mobile} readOnly dir="ltr" />''': '''              <Field\n                id="co-phone"\n                label="شماره موبایل تأییدشده"\n                value={customer.mobile}\n                readOnly\n                autoComplete="tel"\n                dir="ltr"\n              />''',
          '''              <Field\n                label="استان"\n                value={province}\n                onChange={setProvince}\n                autoComplete="address-level1"\n                required={needsAddress}\n              />''': '''              <Field\n                id="co-province"\n                label="استان"\n                value={province}\n                onChange={(value) => {\n                  setProvince(value);\n                  clearFieldError("province");\n                }}\n                autoComplete="address-level1"\n                required={needsAddress}\n                error={fieldErrors.province}\n              />''',
          '''              <Field\n                label="شهر"\n                value={city}\n                onChange={setCity}\n                autoComplete="address-level2"\n                required={needsAddress}\n              />''': '''              <Field\n                id="co-city"\n                label="شهر"\n                value={city}\n                onChange={(value) => {\n                  setCity(value);\n                  clearFieldError("city");\n                }}\n                autoComplete="address-level2"\n                required={needsAddress}\n                error={fieldErrors.city}\n              />''',
          '''                  <Field\n                    label="نشانی"\n                    value={address}\n                    onChange={setAddress}\n                    autoComplete="street-address"\n                    required\n                  />''': '''                  <Field\n                    id="co-address"\n                    label="نشانی"\n                    value={address}\n                    onChange={(value) => {\n                      setAddress(value);\n                      clearFieldError("address");\n                    }}\n                    autoComplete="street-address"\n                    required\n                    error={fieldErrors.address}\n                  />''',
          '''              <Field\n                label="کدپستی (اختیاری)"\n                value={postalCode}\n                onChange={setPostalCode}\n                inputMode="numeric"\n              />''': '''              <Field\n                id="co-postal"\n                label="کدپستی (اختیاری)"\n                value={postalCode}\n                onChange={setPostalCode}\n                autoComplete="postal-code"\n                inputMode="numeric"\n              />''',
          '''              <Field label="یادداشت سفارش (اختیاری)" value={notes} onChange={setNotes} />''': '''              <Field id="co-notes" label="یادداشت سفارش (اختیاری)" value={notes} onChange={setNotes} />'''
          }
          for old, new in replacements.items():
              if old not in text: raise SystemExit('checkout field anchor missing')
              text = text.replace(old, new, 1)
          text = text.replace('''disabled={busy !== null || !cartCompatible || !recipientReady || !selectedMethod}''', '''disabled={busy !== null || !cartCompatible || !selectedMethod}''')

          old_field = '''function Field({\n  label,\n  value,\n  onChange,\n  required,\n  readOnly,\n  autoComplete,\n  dir,\n  inputMode,\n}: {\n  label: string;\n  value: string;\n  onChange?: (value: string) => void;\n  required?: boolean;\n  readOnly?: boolean;\n  autoComplete?: string;\n  dir?: "ltr" | "rtl";\n  inputMode?: "numeric" | "tel" | "text";\n}) {\n  return (\n    <label className="grid gap-2 text-xs font-semibold text-metal">\n      <span>{label}</span>\n      <input\n        value={value}\n        onChange={onChange ? (event) => onChange(event.target.value) : undefined}\n        required={required}\n        readOnly={readOnly}\n        autoComplete={autoComplete}\n        dir={dir}\n        inputMode={inputMode}\n        className="min-h-12 border border-hairline bg-obsidian px-4 text-sm text-bone outline-none read-only:opacity-70 focus-visible:border-signal focus-visible:ring-2 focus-visible:ring-signal/30"\n      />\n    </label>\n  );\n}'''
          new_field = '''function Field({\n  id,\n  label,\n  value,\n  onChange,\n  required,\n  readOnly,\n  autoComplete,\n  dir,\n  inputMode,\n  error,\n}: {\n  id: string;\n  label: string;\n  value: string;\n  onChange?: (value: string) => void;\n  required?: boolean;\n  readOnly?: boolean;\n  autoComplete?: string;\n  dir?: "ltr" | "rtl";\n  inputMode?: "numeric" | "tel" | "text";\n  error?: string;\n}) {\n  const errorId = `${id}-error`;\n  return (\n    <div className="grid gap-2 text-xs font-semibold text-metal">\n      <label htmlFor={id}>{label}</label>\n      <input\n        id={id}\n        value={value}\n        onChange={onChange ? (event) => onChange(event.target.value) : undefined}\n        required={required}\n        readOnly={readOnly}\n        autoComplete={autoComplete}\n        dir={dir}\n        inputMode={inputMode}\n        aria-invalid={error ? "true" : undefined}\n        aria-describedby={error ? errorId : undefined}\n        className="min-h-12 border border-hairline bg-obsidian px-4 text-sm text-bone outline-none read-only:opacity-70 focus-visible:border-signal focus-visible:ring-2 focus-visible:ring-signal/30"\n      />\n      {error ? (\n        <p id={errorId} role="alert" className="text-xs font-semibold leading-6 text-danger">\n          {error}\n        </p>\n      ) : null}\n    </div>\n  );\n}'''
          if old_field not in text: raise SystemExit('Field component anchor missing')
          text = text.replace(old_field, new_field, 1)
          p.write_text(text, encoding='utf-8')

          # Convert active F19-B expected failures into normal regressions and assert RTL direction.
          p = Path('tests/f19-rtl.spec.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('await expect(gallery).toHaveAttribute("dir", "ltr");', 'await expect(gallery).toHaveAttribute("dir", "rtl");')
          for line in [
              '  test.fail(true, "F19B-P1-004 — Quick View thumbnails are 36px wide");\n\n',
              '  test.fail(true, "F19B-P2-001 — Cart Drawer quantity controls are currently 36px square");\n\n',
              '  test.fail(true, "F19B-P2-002 — active filter chips currently use a 40px minimum height");\n\n',
          ]:
              text = text.replace(line, '')
          extra = '''\n\ntest("F19B-P2-004: FAQ and 404 secondary chips meet the 44px target", async ({ page }) => {\n  await page.setViewportSize({ width: 390, height: 844 });\n  await page.goto("/faq", { waitUntil: "networkidle" });\n  await expectTouchTarget(page.getByRole("link", { name: "محصول و موجودی" }));\n  await page.goto("/f19-secondary-route-does-not-exist", { waitUntil: "networkidle" });\n  await expectTouchTarget(page.getByRole("link", { name: "فروشگاه" }).first());\n});\n'''
          if 'F19B-P2-004: FAQ and 404 secondary chips' not in text:
              text += extra
          p.write_text(text, encoding='utf-8')

          p = Path('tests/f19-interactions.spec.ts')
          text = p.read_text(encoding='utf-8')
          start = text.index('test("F19B-P1-002: checkout errors are accessible whenever identity collection is enabled"')
          end = text.index('\ntest("route navigation never leaves focus', start)
          replacement = '''test("F19B-P1-002: checkout errors are associated and first-error focus is managed", async ({\n  page,\n}) => {\n  await addProductToCart(page);\n  await page.goto("/checkout", { waitUntil: "networkidle" });\n\n  const form = page.locator("form");\n  if ((await form.count()) === 0) {\n    await expect(page.getByText(/جمع نهایی، روش تحویل و پرداخت/)).toBeVisible();\n    return;\n  }\n\n  const fields = ["name", "province", "city", "address"] as const;\n  for (const field of fields) {\n    const control = page.locator(`#co-${field}`);\n    await expect(control).toHaveAttribute("required", "");\n  }\n});\n'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')

          # Dedicated live checkout accessibility regression.
          Path('tests/f19b-live-checkout.spec.ts').write_text('''import { expect, test } from "@playwright/test";\n\nconst meta = { apiVersion: "v1", contractVersion: "2026-08-09-f14-be-f1" };\n\ntest("live checkout associates custom errors and focuses the first invalid field", async ({ page }) => {\n  await page.addInitScript(() => {\n    localStorage.setItem(\n      "lbb-cart-v2",\n      JSON.stringify({\n        schemaVersion: 1,\n        mode: "live",\n        updatedAt: Date.now(),\n        lines: [\n          {\n            slug: "f19-live",\n            name: "F19 live fixture",\n            price: 100000,\n            variantId: "01234567890123456789012345",\n            source: "backend",\n            qty: 1,\n          },\n        ],\n      }),\n    );\n  });\n\n  await page.route("https://api.example.test/api/v1/**", async (route) => {\n    const url = new URL(route.request().url());\n    if (url.pathname === "/api/v1/auth/me") {\n      await route.fulfill({\n        contentType: "application/json",\n        body: JSON.stringify({\n          success: true,\n          data: {\n            user: {\n              id: "customer-f19",\n              mobile: "09120000000",\n              fullName: null,\n              email: null,\n              mobileVerified: true,\n              marketingConsent: false,\n              createdAt: null,\n              updatedAt: null,\n            },\n          },\n          meta,\n        }),\n      });\n      return;\n    }\n    if (url.pathname === "/api/v1/delivery/options") {\n      await route.fulfill({\n        contentType: "application/json",\n        body: JSON.stringify({\n          success: true,\n          data: {\n            zone: {\n              id: "zone-f19",\n              name: "Test zone",\n              minimumOrderToman: null,\n              freeDeliveryThresholdToman: null,\n              packagingFeeToman: 0,\n              processing: { minDays: 1, maxDays: 2 },\n            },\n            methods: [{ method: "standard", label: "ارسال استاندارد", enabled: true, feeToman: 0 }],\n          },\n          meta,\n        }),\n      });\n      return;\n    }\n    await route.fulfill({\n      status: 404,\n      contentType: "application/json",\n      body: JSON.stringify({ success: false, code: "not_found", message: "not found", errors: {}, meta }),\n    });\n  });\n\n  await page.goto("/checkout", { waitUntil: "networkidle" });\n  const submit = page.getByRole("button", { name: "دریافت جمع نهایی از Backend" });\n  await expect(submit).toBeEnabled();\n  await submit.click();\n\n  for (const field of ["name", "province", "city", "address"] as const) {\n    const control = page.locator(`#co-${field}`);\n    await expect(control).toHaveAttribute("aria-invalid", "true");\n    await expect(control).toHaveAttribute("aria-describedby", `co-${field}-error`);\n    await expect(page.locator(`#co-${field}-error`)).toBeVisible();\n  }\n  await expect(page.locator("#co-name")).toBeFocused();\n});\n''', encoding='utf-8')

          # F19-B source gate and completion docs.
          Path('scripts/audit-f19b-remediation.mjs').write_text('''import fs from "node:fs";\n\nconst read = (path) => fs.readFileSync(path, "utf8");\nconst gallery = read("src/components/lbb/product/Gallery.tsx");\nconst quick = read("src/components/lbb/ProductQuickView.tsx");\nconst cart = read("src/components/lbb/CartDrawer.tsx");\nconst filters = read("src/components/lbb/ProductGridControls.tsx");\nconst checkout = read("src/routes/checkout.tsx");\nconst card = read("src/components/lbb/ProductCard.tsx");\nconst facts = read("src/components/lbb/product/ProductFacts.tsx");\nconst rtlTests = read("tests/f19-rtl.spec.ts");\n\nconst required = [\n  [gallery, 'dir="rtl"', "PDP gallery exposes RTL direction"],\n  [gallery, 'getBoundingClientRect()', "gallery active index avoids raw RTL scrollLeft math"],\n  [quick, 'h-11 w-11 overflow-hidden', "Quick View thumbnails meet 44px target"],\n  [quick, 'event.key === "ArrowLeft"', "Quick View keyboard direction is explicit"],\n  [cart, 'h-11 w-11 place-items-center', "Cart quantity targets meet 44px"],\n  [filters, 'min-h-11 items-center', "filter chips meet 44px"],\n  [checkout, 'aria-invalid={error ? "true" : undefined}', "checkout exposes aria-invalid"],\n  [checkout, 'aria-describedby={error ? errorId : undefined}', "checkout errors are associated"],\n  [checkout, 'document.getElementById(`co-${first}`)?.focus()', "checkout focuses first custom error"],\n  [card, 'aria-label={`رنگ‌های موجود:', "product cards announce color names"],\n  [facts, '<Identifier>{model.identity.sku}</Identifier>', "PDP SKU uses bidi isolation"],\n];\nfor (const [source, token, message] of required) {\n  if (!source.includes(token)) throw new Error(`F19-B audit failed: ${message}`);\n}\nif (rtlTests.includes('test.fail(true, "F19B-P1-004') || rtlTests.includes('test.fail(true, "F19B-P2-001') || rtlTests.includes('test.fail(true, "F19B-P2-002')) {\n  throw new Error("F19-B audit failed: active touch debt is still marked expected-failure");\n}\nconsole.log("F19-B remediation audit: PASS");\n''', encoding='utf-8')

          Path('docs/f19/f19b-completion.md').write_text('''# F19-B Completion\n\nF19-B remediates the active Wave-1 accessibility/RTL debt on the accepted Wave 3 baseline.\n\n## Resolved\n- P1-002: live checkout custom errors now have stable IDs, `aria-invalid`, `aria-describedby`, and first-error focus. Verified customer mobile remains read-only and is not given a fabricated validation error.\n- P1-003: PDP mobile gallery selectors are retained at the already-remediated 44px target and remain covered by regression.\n- P1-004: Quick View thumbnails are normalized to 44×44.\n- P1-005: the PDP carousel now exposes RTL direction; active-index detection uses element geometry rather than browser-specific RTL `scrollLeft`. ArrowLeft means next, ArrowRight means previous; Home/End are deterministic. Quick View follows the same keyboard/arrow/swipe rule.\n- P2-001: Cart Drawer quantity controls are 44×44.\n- P2-002: active filter and reset controls are at least 44px high.\n- P2-003: Latin identifiers use a bidi-isolated `Identifier` primitive in product metadata surfaces.\n- P2-004: small CTAs, FAQ chips and 404 navigation chips are normalized to the 44px project target.\n- P3-001: ProductCard announces concise color names at group level instead of count-only semantics.\n\n## RTL carousel rule\nIn RTL product media, moving visually left advances to the next media item and moving visually right returns to the previous item. Keyboard ArrowLeft/ArrowRight, Quick View arrow controls and swipe direction follow the same rule. Vertical PDP thumbnail navigation keeps ArrowDown=next and ArrowUp=previous.\n\nNo accessibility gate is weakened or suppressed.\n''', encoding='utf-8')

          # Package scripts.
          p = Path('package.json')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''"audit:a11y": "node scripts/audit-a11y.mjs",''', '''"audit:a11y": "node scripts/audit-a11y.mjs",\n    "audit:f19b": "node scripts/audit-f19b-remediation.mjs",''')
