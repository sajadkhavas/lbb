name: P4 temporary autopatch retry

on:
  push:
    branches:
      - phase/lbb-p4-commerce-go-live
    paths:
      - .github/workflows/p4-autopatch-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/lbb-p4-commerce-go-live
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply canonical P4 replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement context: {path}: {old!r}')
              p.write_text(text.replace(old, new))

          replace('src/routes/checkout.tsx', '  const needsAddress = deliveryMethod === "standard";', '  const needsAddress = deliveryMethod !== "";')
          replace('src/lib/store-settings.ts', 'id: "courier-karaj-tehran"', 'id: "immediate_courier"')
          replace('src/lib/store-settings.ts', 'id: "tipax-collect"', 'id: "tipax"')
          replace('src/lib/store-settings.ts', 'id: "dekapost-collect"', 'id: "decapost"')
          replace('src/lib/store-settings.ts', 'id: "iran-post-express"', 'id: "express_post"')
          replace('.env.example', '# 2026-08-09-f14-be-f1', '# 2026-09-06-p3-storefront-v1')
          PY
          npx prettier --write src/routes/checkout.tsx src/lib/store-settings.ts src/lib/backend-api.ts
      - name: Commit and remove temporary workflows
        run: |
          rm -f .github/workflows/p4-autopatch.yml .github/workflows/p4-autopatch-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p4): canonicalize live commerce frontend [p4-auto]'
          git push origin HEAD:phase/lbb-p4-commerce-go-live
