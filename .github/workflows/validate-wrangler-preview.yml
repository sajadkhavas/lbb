name: Validate Wrangler preview

on:
  push:
    branches:
      - phase/f8-quality-foundation
    paths:
      - .github/workflows/validate-wrangler-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-wrangler-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  VITE_SITE_URL: https://lbb.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase/f8-quality-foundation

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Rebuild and prove npm lockfile
        run: |
          rm -rf node_modules
          validated=false
          for attempt in 1 2 3; do
            echo "Lockfile validation attempt ${attempt}"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if npm ci --ignore-scripts --no-audit --no-fund; then
              validated=true
              break
            fi
          done
          if [ "$validated" != "true" ]; then
            echo "npm ci did not accept the updated lockfile."
            exit 1
          fi

      - name: Build deployable Worker
        run: npm run build

      - name: Prove Wrangler preview starts
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lbb-wrangler-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/lbb-home.html; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "Wrangler preview exited before becoming ready."
              cat /tmp/lbb-wrangler-preview.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/lbb-wrangler-preview.log
          if [ "$ready" != "true" ]; then
            echo "Wrangler preview did not become ready."
            exit 1
          fi
          grep -q '<html' /tmp/lbb-home.html

      - name: Commit validated lockfile on latest head
        run: |
          cp package-lock.json /tmp/lbb-package-lock.json
          git fetch origin phase/f8-quality-foundation
          git reset --hard origin/phase/f8-quality-foundation
          cp /tmp/lbb-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Validated lockfile is unchanged."
          else
            git commit -m "fix(quality): lock Wrangler preview runtime"
            git push origin HEAD:phase/f8-quality-foundation
          fi
