name: Temporary Final Admin Control Docs Formatter

on:
  push:
    branches:
      - docs/final-admin-control-closure-20260910

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/final-admin-control-closure-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format closure docs and commit only formatter output
        shell: bash
        run: |
          set -Eeuo pipefail
          npx prettier --write \
            docs/FINAL_ADMIN_PANEL_CONTROL_GAP_AUDIT_2026-09-10_FA.md \
            docs/LBB_PROJECT_MASTER_LEDGER_APPENDIX_2026-09-10_FA.md
          if git diff --quiet -- \
            docs/FINAL_ADMIN_PANEL_CONTROL_GAP_AUDIT_2026-09-10_FA.md \
            docs/LBB_PROJECT_MASTER_LEDGER_APPENDIX_2026-09-10_FA.md; then
            echo 'FORMAT_DIFF=NO'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/FINAL_ADMIN_PANEL_CONTROL_GAP_AUDIT_2026-09-10_FA.md \
            docs/LBB_PROJECT_MASTER_LEDGER_APPENDIX_2026-09-10_FA.md
          git commit -m 'docs: format final admin control closure'
          git push origin HEAD:docs/final-admin-control-closure-20260910
