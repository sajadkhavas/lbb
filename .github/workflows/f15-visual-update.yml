name: F15 visual validation helper

on:
  push:
    branches:
      - phase/f15-product-decision-pdp-2

permissions:
  contents: write

jobs:
  validate-and-update:
    if: ${{ !contains(github.event.head_commit.message, 'F15 update PDP visual baselines') }}
    runs-on: ubuntu-24.04
    env:
      VITE_SITE_URL: https://lbb.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f15-product-decision-pdp-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Format touched F15 and compatibility tests
        run: |
          npx prettier --write \
            src/components/lbb/product/Gallery.tsx \
            src/components/lbb/product/StickyBuyBar.tsx \
            tests/accessibility.spec.ts \
            tests/f15-pdp-a11y.spec.ts \
            tests/f19-rtl.spec.ts \
            tests/navigation-history.spec.ts
      - name: Validate F15 and Wave-1 compatibility tests
        run: >-
          npx playwright test
          tests/f15-product-decision.spec.ts
          tests/f15-pdp-a11y.spec.ts
          tests/accessibility.spec.ts
          tests/f19-rtl.spec.ts
          tests/navigation-history.spec.ts
      - name: Update PDP visual baselines
        run: >-
          npx playwright test
          tests/visual.spec.ts
          tests/f15-pdp-visual.spec.ts
          --update-snapshots
      - name: Commit approved visual baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/lbb/product/Gallery.tsx \
            src/components/lbb/product/StickyBuyBar.tsx \
            tests/accessibility.spec.ts \
            tests/f15-pdp-a11y.spec.ts \
            tests/f19-rtl.spec.ts \
            tests/navigation-history.spec.ts \
            tests/visual.spec.ts-snapshots \
            tests/f15-pdp-visual.spec.ts-snapshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'F15 update PDP visual baselines'
          git push origin HEAD:phase/f15-product-decision-pdp-2
