name: Temporary Final Admin Formatter

on:
  push:
    branches:
      - final/admin-driven-storefront-control

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatter]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format changed source and docs with repository Prettier
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin fix/lbb-local-boutique-homepage
          mapfile -t files < <(
            git diff --name-only origin/fix/lbb-local-boutique-homepage...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml'
          )
          if ((${#files[@]})); then
            npx prettier --write -- "${files[@]}"
          fi

      - name: Commit formatter-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'FORMAT_DELTA=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: format final admin storefront [formatter]'
          git push origin HEAD:final/admin-driven-storefront-control
