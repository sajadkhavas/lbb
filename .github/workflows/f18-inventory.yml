# Temporary inventory trigger: rerun F18 implementation after the reduced-motion CSS hardening.
name: F18 Motion Runtime Inventory

on:
  push:
    branches:
      - phase/f18-motion-performance-polish

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Motion runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MOTION SYMBOL REFERENCES ====='
          grep -RInE 'SmoothScroll|CustomCursor|MagneticButton|useReveal|BestSellers|HeroSplit|requestAnimationFrame|from "gsap|import\("gsap|from "lenis|import\("lenis|from "motion|import\("motion' src tests --exclude='*.map' || true
          echo
          echo '===== ACTIVE IMPORTS OF LEGACY MOTION ====='
          grep -RInE 'SmoothScroll|CustomCursor|MagneticButton|BestSellers|HeroSplit|use-reveal' src/routes src/components/lbb --exclude='CustomCursor.tsx' --exclude='MagneticButton.tsx' --exclude='BestSellers.tsx' --exclude='HeroSplit.tsx' || true
          echo
          echo '===== PACKAGE REFERENCES ====='
          grep -RInE '"(gsap|lenis|motion)"' package.json package-lock.json | head -80 || true
