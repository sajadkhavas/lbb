name: F14C align and validate once

on:
  push:
    branches:
      - phase/f14c-production-content-product-data
    paths:
      - .github/workflows/f14c-align-and-validate-once.yml

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example

jobs:
  align-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/f14c-production-content-product-data
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Register audit and align textual contracts
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts["audit:product-evidence"] = "node scripts/audit-product-evidence.mjs";
          if (!pkg.scripts.quality.includes("audit:product-evidence")) {
            pkg.scripts.quality = pkg.scripts.quality.replace(
              "npm run audit:store-settings && npm run audit:source",
              "npm run audit:store-settings && npm run audit:product-evidence && npm run audit:source",
            );
          }
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);

          const designPath = "tests/design-system.spec.ts";
          let design = fs.readFileSync(designPath, "utf8");
          design = design.replace('name: "Tehran After Dark"', 'name: "Karaj After Dark"');
          fs.writeFileSync(designPath, design);

          const homePath = "tests/homepage-narrative.spec.ts";
          let home = fs.readFileSync(homePath, "utf8");
          home = home.replace(
            'await expect(page).toHaveTitle(/LBB \\| استریت‌ویر تهران — دراپ ۰۰۱/);',
            'await expect(page).toHaveTitle(/LBB \\| فروشگاه پوشاک شهری در کرج، پاساژ مهستان/);',
          );
          home = home.replace(
            'page.getByRole("heading", { level: 1, name: /تهران را.*با فرم.*خودت بپوش/ }),',
            'page.getByRole("heading", { level: 1, name: /از مهستان،.*برای.*خیابان/ }),',
          );
          home = home.replace(
            '  await expect(page.getByRole("link", { name: /خرید DROP 001/ })).toBeVisible();',
            '  const hero = page.locator(\'section[aria-labelledby="home-hero-title"]\');\n  await expect(hero.getByRole("link", { name: "مشاهده فروشگاه" })).toBeVisible();',
          );
          home = home.replace(
            /  await expect\(\n    page\.getByText\("8", \{ exact: true \}\)\.or\(page\.getByText\("۸", \{ exact: true \}\)\),\n  \)\.toBeVisible\(\);\n  await expect\(page\.getByText\("پرداخت و ارسال واقعی در این نسخه فعال نیست"\)\)\.toBeVisible\(\);/,
            '  await expect(page.getByText("فروشگاه حضوری LBB — کرج، پاساژ مهستان").first()).toBeVisible();',
          );
          home = home.replace(
            'name: "استایل شبانه LBB از دراپ ۰۰۱ در فضای شهری"',
            'name: "استایل پوشاک شهری LBB از دراپ ۰۰۱"',
          );
          fs.writeFileSync(homePath, home);
          NODE

      - name: Format changed text files
        run: npx prettier --write package.json tests/design-system.spec.ts tests/homepage-narrative.spec.ts src/lib/product-evidence.ts src/lib/launch-readiness.ts scripts/audit-product-evidence.mjs docs/F14C_PRODUCT_DATA_CONTRACT.md docs/F14C_PERSIAN_CONTENT_GLOSSARY.md

      - name: Validate code and evidence boundaries
        run: |
          npm run format:check
          npm run lint
          npm run build
          npm run typecheck
          npm run audit:brand
          npm run audit:store-settings
          npm run audit:product-evidence
          npm run audit:source

      - name: Refresh intentional visual baselines
        run: npx playwright test tests/homepage-visual.spec.ts tests/catalog-visual.spec.ts tests/visual.spec.ts --update-snapshots

      - name: Run complete browser suite
        run: npm run test:e2e

      - name: Remove one-time workflow
        if: success()
        run: rm .github/workflows/f14c-align-and-validate-once.yml

      - name: Commit validated F14C changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tests src/lib/product-evidence.ts src/lib/launch-readiness.ts scripts/audit-product-evidence.mjs docs/F14C_PRODUCT_DATA_CONTRACT.md docs/F14C_PERSIAN_CONTENT_GLOSSARY.md .github/workflows/f14c-align-and-validate-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "F14C: validate production content and product evidence"
          git push origin HEAD:phase/f14c-production-content-product-data
