name: F11 design system artifact validation

on:
  pull_request:
    branches:
      - validation/f11-design-system-2

permissions:
  contents: write

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f11-design-system-2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic F11 cleanup
        run: |
          python <<'PY'
          from pathlib import Path

          route = Path('src/routes/design-system.tsx')
          text = route.read_text()
          text = text.replace(
              'import { Check, Heart, Info, LoaderCircle, ShoppingBag, TriangleAlert } from "lucide-react";',
              'import { Heart, LoaderCircle, ShoppingBag } from "lucide-react";',
          )
          old = '<Link to="/collections/drop-01-shabgard" className={`${CtaClasses("signal", "sm")} mt-5 self-start`}>مشاهده کالکشن</Link>'
          new = '''<Link
                to="/collections/$slug"
                params={{ slug: "drop-01-shabgard" }}
                className={`${CtaClasses("signal", "sm")} mt-5 self-start`}
              >
                مشاهده کالکشن
              </Link>'''
          if old not in text:
              raise SystemExit('Expected collection link marker was not found')
          route.write_text(text.replace(old, new))

          styles = Path('src/styles.css')
          css = styles.read_text()
          marker = '  --ease-lbb: var(--ease-lbb);\n'
          if marker not in css:
              raise SystemExit('Expected self-referential theme marker was not found')
          styles.write_text(css.replace(marker, ''))
          PY

      - name: Format F11 scope
        run: |
          npx prettier --write \
            src/styles.css \
            src/lib/design-system.ts \
            src/components/lbb/ui/primitives.tsx \
            src/routes/design-system.tsx \
            tests/all-routes.spec.ts \
            tests/accessibility.spec.ts \
            tests/design-system.spec.ts \
            tests/visual.spec.ts \
            docs/f11

      - name: Build and generate typed route tree
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Commit generated F11 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/styles.css \
            src/lib/design-system.ts \
            src/components/lbb/ui/primitives.tsx \
            src/routes/design-system.tsx \
            src/routeTree.gen.ts \
            tests/all-routes.spec.ts \
            tests/accessibility.spec.ts \
            tests/design-system.spec.ts \
            tests/visual.spec.ts \
            tests/visual.spec.ts-snapshots \
            docs/f11
          if ! git diff --cached --quiet; then
            git commit -m 'test(f11): register design system route and visual artifacts'
            git push origin HEAD:phase/f11-design-system-2
          fi

      - name: Run complete immutable quality suite
        run: npm run quality

      - name: Verify tracked files remain stable
        run: git diff --exit-code -- . ':(exclude)playwright-report' ':(exclude)test-results'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f11-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
