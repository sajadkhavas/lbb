name: Temporary Final Product UX Visual Baselines

on:
  push:
    branches:
      - hotfix/final-product-ux-gate

permissions:
  contents: write

jobs:
  update-visual-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 61015c5fcb3ccd338b00ce61c635f62a811baffe
      VITE_SITE_URL: https://lbb.example.test
      VITE_LBB_BACKEND_MODE: prototype
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/final-product-ux
          fetch-depth: 0

      - name: Lock implementation source
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SOURCE_SHA"
          printf 'EXPECTED_SOURCE_SHA=%s\nACTUAL_SHA=%s\nTREE_SHA=%s\n' \
            "$EXPECTED_SOURCE_SHA" "$ACTUAL_SHA" "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update changed visual snapshots in exact CI environment
        run: |
          npx playwright test \
            tests/catalog-visual.spec.ts \
            tests/f15-pdp-visual.spec.ts \
            tests/homepage-visual.spec.ts \
            tests/visual.spec.ts \
            --project=chromium \
            --update-snapshots=changed

      - name: Guard exact visual-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/expected <<'EOF'
          tests/catalog-visual.spec.ts-snapshots/f14-category-desktop-chromium-linux.png
          tests/catalog-visual.spec.ts-snapshots/f14-search-mobile-chromium-linux.png
          tests/catalog-visual.spec.ts-snapshots/f14-shop-desktop-chromium-linux.png
          tests/f15-pdp-visual.spec.ts-snapshots/f15-pdp-default-desktop-1440-chromium-linux.png
          tests/f15-pdp-visual.spec.ts-snapshots/f15-pdp-default-wide-1920-chromium-linux.png
          tests/f15-pdp-visual.spec.ts-snapshots/f15-pdp-gallery-focused-desktop-chromium-linux.png
          tests/homepage-visual.spec.ts-snapshots/f13-drop-story-desktop-chromium-linux.png
          tests/homepage-visual.spec.ts-snapshots/f13-product-moments-mobile-chromium-linux.png
          tests/visual.spec.ts-snapshots/home-desktop-1440-chromium-linux.png
          tests/visual.spec.ts-snapshots/home-mobile-390-chromium-linux.png
          tests/visual.spec.ts-snapshots/home-tablet-768-chromium-linux.png
          tests/visual.spec.ts-snapshots/home-wide-1920-chromium-linux.png
          tests/visual.spec.ts-snapshots/product-desktop-chromium-linux.png
          tests/visual.spec.ts-snapshots/shop-mobile-chromium-linux.png
          EOF
          sort -o /tmp/expected /tmp/expected
          git diff --name-only | sort > /tmp/actual
          echo 'EXPECTED_VISUAL_DELTA:'
          cat /tmp/expected
          echo 'ACTUAL_VISUAL_DELTA:'
          cat /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(wc -l < /tmp/actual)" -eq 14
          while IFS= read -r path; do
            case "$path" in
              tests/*-snapshots/*.png) ;;
              *) echo "UNEXPECTED_NON_VISUAL_CHANGE=$path" >&2; exit 1 ;;
            esac
          done < /tmp/actual
          git diff --check

      - name: Commit exact Playwright visual baselines
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/catalog-visual.spec.ts-snapshots \
            tests/f15-pdp-visual.spec.ts-snapshots \
            tests/homepage-visual.spec.ts-snapshots \
            tests/visual.spec.ts-snapshots
          git commit -m 'test(visual): accept final product UX baselines'
          git push origin HEAD:hotfix/final-product-ux
