name: F7 shop search contract patch

on:
  push:
    branches:
      - phase/f7-content-editorial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial
          fetch-depth: 0

      - name: Align F7 shop links with F4/F5 URL contract
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path("src/routes/about.tsx"),
              Path("src/routes/collections.$slug.tsx"),
              Path("src/routes/collections.index.tsx"),
              Path("src/routes/faq.tsx"),
              Path("src/routes/lookbook.tsx"),
          ]

          for path in paths:
              text = path.read_text()
              text = text.replace('import { EMPTY_FILTERS } from "@/lib/product-filter";\n', "")
              text = text.replace("search={EMPTY_FILTERS}", "search={{}}")
              path.write_text(text)
          PY

      - name: Commit production-only patch and remove workflow
        run: |
          git rm .github/workflows/f7-shop-search-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/about.tsx \
            'src/routes/collections.$slug.tsx' \
            src/routes/collections.index.tsx \
            src/routes/faq.tsx \
            src/routes/lookbook.tsx
          git commit -m "fix(f7): align shop links with canonical search contract"
          git push origin HEAD:phase/f7-content-editorial
