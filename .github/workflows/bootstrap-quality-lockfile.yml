name: Bootstrap quality lockfile

on:
  push:
    branches:
      - phase/f8-quality-foundation
    paths:
      - package.json
      - .github/workflows/bootstrap-quality-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message || '', 'chore(quality): generate npm lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/f8-quality-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and generate npm lockfile
        run: npm install --ignore-scripts

      - name: Format F8-A owned files
        run: >-
          npx prettier --write
          package.json
          vite.config.ts
          eslint.config.js
          playwright.config.ts
          playwright.visual.config.ts
          tsconfig.tests.json
          knip.json
          config/*.json
          scripts/*.mjs
          src/lib/site.ts
          src/lib/pwa.ts
          src/routes/__root.tsx
          'src/routes/sitemap[.]xml.ts'
          src/components/lbb/Logo.tsx
          src/fonts.css
          tests/**/*.ts
          tests/**/*.md
          docs/**/*.md
          .github/workflows/bootstrap-quality-lockfile.yml

      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json vite.config.ts eslint.config.js \
            playwright.config.ts playwright.visual.config.ts tsconfig.tests.json knip.json \
            config scripts src/lib/site.ts src/lib/pwa.ts src/routes/__root.tsx \
            'src/routes/sitemap[.]xml.ts' src/components/lbb/Logo.tsx src/fonts.css \
            tests docs .github/workflows/bootstrap-quality-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile or formatting changes to commit."
          else
            git commit -m "chore(quality): generate npm lockfile"
            git push origin HEAD:phase/f8-quality-foundation
          fi
