name: Temporary 3D dependency lock

on:
  push:
    branches:
      - feature/lbb-pdp-3d-viewer-20260910

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lbb-pdp-3d-viewer-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact npm lock entries
        run: |
          npm install --save-exact three@0.185.1
          npm install --save-dev --save-exact @types/three@0.185.1
      - name: Commit deterministic dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CURRENT=YES"
            exit 0
          fi
          git commit -m "build: lock Three.js viewer dependencies"
          git push origin HEAD:feature/lbb-pdp-3d-viewer-20260910
