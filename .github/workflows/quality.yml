name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VITE_SITE_URL: https://lbb.example.test
  VITE_LBB_BACKEND_MODE: prototype

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: Run complete quality suite
        run: npm run quality

      - name: Capture current Chromium visual baselines for review
        if: failure()
        continue-on-error: true
        run: >-
          npx playwright test
          tests/visual.spec.ts
          tests/catalog-visual.spec.ts
          tests/f15-pdp-visual.spec.ts
          tests/f17-visual.spec.ts
          tests/homepage-visual.spec.ts
          --update-snapshots --workers=2 --retries=0

      - name: Upload visual baselines for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-visual-baselines
          path: tests/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
