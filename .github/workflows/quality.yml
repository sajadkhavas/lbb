name: Quality foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase/f8-quality-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  VITE_SITE_URL: https://lbb.test

jobs:
  quality:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck test infrastructure
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright quality tests
        run: npm run test:quality

      - name: Visual infrastructure smoke
        run: npm run test:visual

      - name: Production artifact audit
        run: npm run audit:production

      - name: Bundle budgets
        run: npm run bundle:check

      - name: Dead-code report
        run: npm run dead-code:report

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts-${{ github.run_id }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 14
