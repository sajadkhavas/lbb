name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VITE_SITE_URL: https://lbb.example.test

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @typescript/native-preview

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete quality suite
        run: npm run quality

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
