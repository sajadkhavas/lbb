name: F7 not-found heading patch

on:
  push:
    branches:
      - phase/f7-content-editorial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial
          fetch-depth: 0

      - name: Replace generic empty states with page-level headings
        run: |
          python <<'PY'
          from pathlib import Path

          collection = Path("src/routes/collections.$slug.tsx")
          text = collection.read_text()
          old = '''            <EmptyState
              icon={<Layers3 aria-hidden="true" size={34} />}
              title="این کالکشن پیدا نشد"
              body="آدرس کالکشن معتبر نیست یا این صفحه دیگر در فهرست کالکشن‌های LBB قرار ندارد."
              action={
                <Link to="/collections" className={CtaClasses("signal")}>
                  بازگشت به کالکشن‌ها
                </Link>
              }
            />'''
          new = '''            <div className="flex flex-col items-center gap-4 rounded-2xl border border-hairline bg-carbon px-6 py-20 text-center">
              <span className="text-mute">
                <Layers3 aria-hidden="true" size={34} />
              </span>
              <h1 className="text-display-3 text-bone">این کالکشن پیدا نشد</h1>
              <p className="max-w-[42ch] text-sm leading-7 text-metal">
                آدرس کالکشن معتبر نیست یا این صفحه دیگر در فهرست کالکشن‌های LBB قرار ندارد.
              </p>
              <Link to="/collections" className={CtaClasses("signal")}>
                بازگشت به کالکشن‌ها
              </Link>
            </div>'''
          if old not in text:
              raise SystemExit("collection not-found block not found")
          collection.write_text(text.replace(old, new))

          journal = Path("src/routes/journal.$slug.tsx")
          text = journal.read_text()
          old = '''            <EmptyState
              icon={<BookOpenText aria-hidden="true" size={34} />}
              title="این مقاله پیدا نشد"
              body="آدرس مقاله معتبر نیست یا این مطلب دیگر در فهرست ژورنال قرار ندارد."
              action={
                <Link to="/journal" className={CtaClasses("signal")}>
                  بازگشت به ژورنال
                </Link>
              }
            />'''
          new = '''            <div className="flex flex-col items-center gap-4 rounded-2xl border border-hairline bg-carbon px-6 py-20 text-center">
              <span className="text-mute">
                <BookOpenText aria-hidden="true" size={34} />
              </span>
              <h1 className="text-display-3 text-bone">این مقاله پیدا نشد</h1>
              <p className="max-w-[42ch] text-sm leading-7 text-metal">
                آدرس مقاله معتبر نیست یا این مطلب دیگر در فهرست ژورنال قرار ندارد.
              </p>
              <Link to="/journal" className={CtaClasses("signal")}>
                بازگشت به ژورنال
              </Link>
            </div>'''
          if old not in text:
              raise SystemExit("journal not-found block not found")
          journal.write_text(text.replace(old, new).replace("  EmptyState,\n", ""))
          PY

      - name: Format and commit production patch
        run: |
          npx prettier --write 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'
          git rm .github/workflows/f7-not-found-heading-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/collections.$slug.tsx' 'src/routes/journal.$slug.tsx'
          git commit -m "fix(f7): use page-level headings for invalid slugs"
          git push origin HEAD:phase/f7-content-editorial
