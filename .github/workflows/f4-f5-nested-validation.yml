name: F4 F5 nested validation

on:
  pull_request:
    branches:
      - tmp/f4-f5-validation-20260804

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve a clean dependency tree
        run: |
          node --version
          npm --version
          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm install --ignore-scripts
          rm -rf node_modules
      - name: npm ci
        run: npm ci
      - name: Apply optional search typing migration
        run: node .github/scripts/f4-f5-fix-search-types.mjs
      - name: Format owned files
        run: >-
          npx prettier --write
          'src/routes/shop.tsx'
          'src/routes/$category.tsx'
          'src/routes/search.tsx'
          'src/routes/product.$slug.tsx'
          'src/components/lbb/ProductCard.tsx'
          'src/components/lbb/ProductFilters.tsx'
          'src/components/lbb/ProductGridControls.tsx'
          'src/components/lbb/ProductQuickView.tsx'
          'src/components/lbb/product/Gallery.tsx'
          'src/components/lbb/product/StickyBuyBar.tsx'
          'src/lib/product-filter.ts'
          'src/lib/quickview.tsx'
          'src/lib/recent-searches.ts'
          'src/lib/recently-viewed.ts'
      - name: Commit migration and formatting to temporary validation base
        shell: bash
        run: |
          paths=(
            'src/routes/shop.tsx'
            'src/routes/$category.tsx'
            'src/routes/search.tsx'
            'src/routes/product.$slug.tsx'
            'src/components/lbb/ProductCard.tsx'
            'src/components/lbb/ProductFilters.tsx'
            'src/components/lbb/ProductGridControls.tsx'
            'src/components/lbb/ProductQuickView.tsx'
            'src/components/lbb/product/Gallery.tsx'
            'src/components/lbb/product/StickyBuyBar.tsx'
            'src/lib/product-filter.ts'
            'src/lib/quickview.tsx'
            'src/lib/recent-searches.ts'
            'src/lib/recently-viewed.ts'
          )
          if git diff --quiet -- "${paths[@]}"; then
            exit 0
          fi
          tar -cf /tmp/f4-f5-formatted.tar "${paths[@]}"
          git fetch origin tmp/f4-f5-validation-20260804
          git checkout -B validation-base origin/tmp/f4-f5-validation-20260804
          tar -xf /tmp/f4-f5-formatted.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(f4): keep catalogue search parameters optional'
          git push origin HEAD:tmp/f4-f5-validation-20260804
      - name: Install tsgo runtime without modifying project manifests
        run: npm install --no-save --package-lock=false @typescript/native-preview
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lbb-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/shop > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lbb-preview.log
          exit 1
      - name: Browser validation
        run: node .github/scripts/f4-f5-browser.mjs
