name: F4 F5 nested validation

on:
  pull_request:
    branches:
      - tmp/f4-f5-validation-20260804

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve a clean dependency tree
        run: |
          node --version
          npm --version
          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm install --ignore-scripts
          rm -rf node_modules
      - name: npm ci
        run: npm ci
      - name: Format owned files and temporary browser script
        run: >-
          npx prettier --write
          'src/routes/shop.tsx'
          'src/routes/$category.tsx'
          'src/routes/search.tsx'
          'src/routes/product.$slug.tsx'
          'src/components/lbb/ProductCard.tsx'
          'src/components/lbb/ProductFilters.tsx'
          'src/components/lbb/ProductGridControls.tsx'
          'src/components/lbb/ProductQuickView.tsx'
          'src/components/lbb/product/Gallery.tsx'
          'src/components/lbb/product/StickyBuyBar.tsx'
          'src/lib/product-filter.ts'
          'src/lib/quickview.tsx'
          'src/lib/recent-searches.ts'
          'src/lib/recently-viewed.ts'
          '.github/scripts/f4-f5-browser.mjs'
      - name: Commit formatting to temporary validation base
        shell: bash
        run: |
          paths=(
            'src/routes/shop.tsx'
            'src/routes/$category.tsx'
            'src/routes/search.tsx'
            'src/routes/product.$slug.tsx'
            'src/components/lbb/ProductCard.tsx'
            'src/components/lbb/ProductFilters.tsx'
            'src/components/lbb/ProductGridControls.tsx'
            'src/components/lbb/ProductQuickView.tsx'
            'src/components/lbb/product/Gallery.tsx'
            'src/components/lbb/product/StickyBuyBar.tsx'
            'src/lib/product-filter.ts'
            'src/lib/quickview.tsx'
            'src/lib/recent-searches.ts'
            'src/lib/recently-viewed.ts'
          )
          if git diff --quiet -- "${paths[@]}"; then
            exit 0
          fi
          tar -cf /tmp/f4-f5-formatted.tar "${paths[@]}"
          git fetch origin tmp/f4-f5-validation-20260804
          git checkout -B validation-base origin/tmp/f4-f5-validation-20260804
          tar -xf /tmp/f4-f5-formatted.tar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'style(f4-f5): format owned files'
          git push origin HEAD:tmp/f4-f5-validation-20260804
      - name: Install tsgo runtime without modifying project manifests
        run: npm install --no-save --package-lock=false @typescript/native-preview
      - name: Typecheck
        run: npm run typecheck
      - name: Lint owned F4/F5 files
        run: >-
          npx eslint
          'src/routes/shop.tsx'
          'src/routes/$category.tsx'
          'src/routes/search.tsx'
          'src/routes/product.$slug.tsx'
          'src/components/lbb/ProductCard.tsx'
          'src/components/lbb/ProductFilters.tsx'
          'src/components/lbb/ProductGridControls.tsx'
          'src/components/lbb/ProductQuickView.tsx'
          'src/components/lbb/product/Gallery.tsx'
          'src/components/lbb/product/StickyBuyBar.tsx'
          'src/lib/product-filter.ts'
          'src/lib/quickview.tsx'
          'src/lib/recent-searches.ts'
          'src/lib/recently-viewed.ts'
      - name: Full repository lint gate
        id: full_lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install chromium
      - name: Start TanStack development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/lbb-dev.log 2>&1 &
          echo $! > /tmp/lbb-dev.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4173/shop > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lbb-dev.log
          exit 1
      - name: Browser validation against TanStack server
        id: browser
        continue-on-error: true
        run: node .github/scripts/f4-f5-browser.mjs > /tmp/f4-f5-browser.log 2>&1
      - name: Upload browser validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-f5-browser-log
          path: /tmp/f4-f5-browser.log
          if-no-files-found: error
      - name: Report browser validation
        if: always()
        shell: bash
        run: |
          echo '===== F4/F5 BROWSER RESULT ====='
          tail -n 40 /tmp/f4-f5-browser.log || true
          if [ '${{ steps.browser.outcome }}' != 'success' ]; then
            exit 1
          fi
      - name: Report full lint blocker
        if: always() && steps.full_lint.outcome != 'success'
        run: |
          echo 'Full repository lint remains blocked by baseline files outside F4/F5 ownership.'
          exit 1
