name: F7 validation

on:
  push:
    branches:
      - phase/f7-content-editorial
  pull_request:
    branches:
      - main

jobs:
  apply-f7-link-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.patch.outputs.changed }}

    steps:
      - name: Checkout F7 branch
        uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial

      - name: Patch typed shop links inside F7 ownership
        id: patch
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path("src/routes/collections.index.tsx"),
              Path("src/routes/collections.$slug.tsx"),
              Path("src/routes/lookbook.tsx"),
              Path("src/routes/about.tsx"),
              Path("src/routes/faq.tsx"),
          ]

          for path in paths:
              text = path.read_text()
              if 'import { EMPTY_FILTERS } from "@/lib/product-filter";' not in text:
                  lines = text.splitlines()
                  for index, line in enumerate(lines):
                      if line.startswith("import ") and 'from "@/lib/site";' in line:
                          lines.insert(index + 1, 'import { EMPTY_FILTERS } from "@/lib/product-filter";')
                          break
                  else:
                      raise RuntimeError(f"site import not found in {path}")
                  text = "\n".join(lines) + "\n"

              text = text.replace(
                  'to="/shop" className=',
                  'to="/shop" search={EMPTY_FILTERS} className=',
              )
              path.write_text(text)
          PY

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/collections.index.tsx 'src/routes/collections.$slug.tsx' src/routes/lookbook.tsx src/routes/about.tsx src/routes/faq.tsx
          git commit -m "F7: type-safe shop links"
          git push origin HEAD:phase/f7-content-editorial
          echo "changed=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: apply-f7-link-fix
    if: always() && (github.event_name == 'pull_request' || needs.apply-f7-link-fix.outputs.changed != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare temporary lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies with npm ci
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install typecheck runtime
        run: npm install --no-save --package-lock=false --legacy-peer-deps @typescript/native-preview@7.0.0-dev.20260707.2

      - name: Run repository typecheck and isolate F7
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if grep -E 'src/(routes/(collections\.index|collections\.\$slug|lookbook|journal\.index|journal\.\$slug|about|faq)\.tsx|lib/(collections|journal)\.ts)' /tmp/typecheck.log; then
            echo "F7-owned type errors remain."
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "Repository typecheck is blocked only by files outside F7 ownership."
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Install browser test runtime
        if: steps.build.outcome == 'success'
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.54.2
          npx playwright install --with-deps chromium

      - name: Start production preview
        if: steps.build.outcome == 'success'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lbb-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lbb-preview.log
          exit 1

      - name: Run F7 browser smoke suite
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test f7-smoke.spec.mjs --reporter=line

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-responsive-screenshots
          path: f7-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce repository gates
        if: always()
        run: |
          failed=0
          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]; then
            echo "Repository typecheck: FAIL"
            failed=1
          else
            echo "Repository typecheck: PASS"
          fi
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Lint: FAIL"
            failed=1
          else
            echo "Lint: PASS"
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build: FAIL"
            failed=1
          else
            echo "Build: PASS"
          fi
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.browser.outcome }}" != "success" ]; then
            echo "Browser smoke: FAIL"
            failed=1
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "Browser smoke: PASS"
          fi
          exit "$failed"
