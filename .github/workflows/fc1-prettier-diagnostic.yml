name: FC1 Prettier Diagnostic

on:
  push:
    branches:
      - feature/fc1-2d-style-mannequin

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/components/lbb/ProductCard.tsx src/lib/style-mannequin.ts
          git --no-pager diff -- src/components/lbb/ProductCard.tsx src/lib/style-mannequin.ts
          if git diff --quiet -- src/components/lbb/ProductCard.tsx src/lib/style-mannequin.ts; then
            echo 'PRETTIER_DIFF=EMPTY'
          else
            echo 'PRETTIER_DIFF=NONEMPTY'
          fi
