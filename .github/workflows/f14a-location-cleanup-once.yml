name: F14A location cleanup once

on:
  push:
    branches:
      - phase/f14a-brand-commerce-constitution
    paths:
      - .github/workflows/f14a-location-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/f14a-brand-commerce-constitution

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Correct remaining brand-location references
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const transforms = [
            {
              path: "src/components/lbb/home/EditorialSplit.tsx",
              replacements: [[/تهران/g, "کرج"]],
            },
            {
              path: "src/components/lbb/home/HeroSplit.tsx",
              replacements: [
                [/TEHRAN/g, "KARAJ"],
                [/تهران/g, "کرج"],
              ],
            },
            {
              path: "src/lib/design-system.ts",
              replacements: [
                [/Tehran/g, "Mahestan"],
                [/TEHRAN/g, "MAHESTAN"],
                [/تهران/g, "مهستان"],
              ],
            },
            {
              path: "src/routes/design-system.tsx",
              replacements: [
                [/TEHRAN/g, "KARAJ"],
                [/Tehran/g, "Karaj"],
                [/تهران/g, "کرج"],
              ],
            },
            {
              path: "src/styles.css",
              replacements: [
                [/Tehran/g, "Mahestan"],
                [/TEHRAN/g, "MAHESTAN"],
                [/تهران/g, "مهستان"],
              ],
            },
          ];

          for (const transform of transforms) {
            let content = fs.readFileSync(transform.path, "utf8");
            for (const [pattern, replacement] of transform.replacements) {
              content = content.replace(pattern, replacement);
            }
            fs.writeFileSync(transform.path, content);
          }
          NODE

      - name: Format corrected files
        run: npx prettier --write scripts/audit-brand-copy.mjs src/components/lbb/home/EditorialSplit.tsx src/components/lbb/home/HeroSplit.tsx src/lib/design-system.ts src/routes/design-system.tsx src/styles.css

      - name: Remove one-time workflow
        run: rm .github/workflows/f14a-location-cleanup-once.yml

      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-brand-copy.mjs \
            src/components/lbb/home/EditorialSplit.tsx \
            src/components/lbb/home/HeroSplit.tsx \
            src/lib/design-system.ts \
            src/routes/design-system.tsx \
            src/styles.css \
            .github/workflows/f14a-location-cleanup-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "F14A: remove remaining Tehran brand references"
          git push origin HEAD:phase/f14a-brand-commerce-constitution
