name: F19B Apply Remediation Source V2

on:
  push:
    branches:
      - phase/f19b-accessibility-rtl-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f19b-accessibility-rtl-remediation
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed F19-B patch
        shell: bash
        run: |
          awk '
            /python3 <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/f19b-apply-source.yml > /tmp/f19b-apply.py
          python3 /tmp/f19b-apply.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/f19-interactions.spec.ts')
          text = p.read_text(encoding='utf-8')
          old = '''  const form = page.locator("form");
  if ((await form.count()) === 0) {
    await expect(page.getByText(/جمع نهایی، روش تحویل و پرداخت/)).toBeVisible();
    return;
  }
'''
          new = '''  const form = page.locator("form");
  if ((await form.count()) === 0) {
    await expect(page.getByRole("heading", { name: "تکمیل سفارش", level: 1 })).toBeVisible();
    await expect(
      page.locator(
        'input[autocomplete="name"], input[autocomplete="tel"], input[autocomplete="street-address"]',
      ),
    ).toHaveCount(0);
    return;
  }
'''
          if old not in text:
              raise SystemExit('prototype checkout assertion anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout HEAD -- .github/workflows
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed source
        run: npx prettier --write src/components/lbb/ui/Identifier.tsx src/components/lbb/product/Gallery.tsx src/components/lbb/ProductQuickView.tsx src/components/lbb/CartDrawer.tsx src/components/lbb/ProductGridControls.tsx src/components/lbb/ui/primitives.tsx src/routes/faq.tsx src/routes/__root.tsx src/components/lbb/product/ProductFacts.tsx src/components/lbb/ProductCard.tsx src/routes/checkout.tsx tests/f19-rtl.spec.ts tests/f19-interactions.spec.ts tests/f19b-live-checkout.spec.ts scripts/audit-f19b-remediation.mjs docs/f19/f19b-completion.md package.json
      - name: Lint
        run: npm run lint
      - name: Build before typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run build
      - name: Typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run typecheck
      - name: F19-B source audit
        run: npm run audit:f19b
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A11y and RTL regressions
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: prototype
        run: npm run test:a11y && npm run test:rtl
      - name: Live checkout accessibility regression
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run test:f19b-live
      - name: Commit validated F19-B source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs/f19 package.json
          git diff --cached --quiet && { echo "No F19-B source changes"; exit 1; }
          git commit -m "fix(f19b): remediate accessibility and RTL debt"
          git push origin HEAD:phase/f19b-accessibility-rtl-remediation
