name: Final Test Prettier Apply

on:
  push:
    branches:
      - feature/final-technical-completion

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-test-prettier]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-technical-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/trust-legal-support.spec.ts
          npx prettier --check tests/trust-legal-support.spec.ts
      - name: Commit exact format
        run: |
          git add tests/trust-legal-support.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format final trust regression test [final-test-prettier]"
          git push origin HEAD:feature/final-technical-completion
