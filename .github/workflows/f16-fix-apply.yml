name: F16 Repair One-Shot Validation

on:
  push:
    branches:
      - phase/f16-cart-commerce-continuity

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f16-cart-commerce-continuity
      - name: Repair build-before-typecheck order
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/f16-apply.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  apply:\n    if: github.actor != 'github-actions[bot]'\n    runs-on: ubuntu-latest", "  apply:\n    runs-on: ubuntu-latest", 1)
          anchor = '''      - name: Typecheck before commit
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run typecheck
'''
          replacement = '''      - name: Build before typecheck
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run build
      - name: Typecheck before commit
        env:
          VITE_SITE_URL: https://lbb.example.test
          VITE_LBB_BACKEND_MODE: live
          VITE_LBB_API_BASE_URL: https://api.example.test
        run: npm run typecheck
'''
          if anchor not in text:
              raise SystemExit('typecheck anchor missing')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          Path('.github/workflows/f16-fix-apply.yml').unlink()
          PY
      - name: Commit repaired workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(f16): run build before typecheck"
          git push origin HEAD:phase/f16-cart-commerce-continuity
