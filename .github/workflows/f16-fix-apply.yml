name: F16 Repair One-Shot Validation

on:
  push:
    branches:
      - phase/f16-cart-commerce-continuity

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase/f16-cart-commerce-continuity
      - name: Repair build-before-typecheck order
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('.github/workflows/f16-apply.yml'); t=p.read_text(); t=t.replace(\"  apply:\\n    if: github.actor != 'github-actions[bot]'\\n    runs-on: ubuntu-latest\", \"  apply:\\n    runs-on: ubuntu-latest\", 1); needle='      - name: Typecheck before commit\\n'; insert='      - name: Build before typecheck\\n        env:\\n          VITE_SITE_URL: https://lbb.example.test\\n          VITE_LBB_BACKEND_MODE: live\\n          VITE_LBB_API_BASE_URL: https://api.example.test\\n        run: npm run build\\n'; assert needle in t; p.write_text(t.replace(needle, insert+needle, 1)); Path('.github/workflows/f16-fix-apply.yml').unlink()"
      - name: Commit repaired workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(f16): run build before typecheck"
          git push origin HEAD:phase/f16-cart-commerce-continuity
