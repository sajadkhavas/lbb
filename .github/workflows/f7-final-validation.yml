name: F7 final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout F7 branch
        uses: actions/checkout@v4
        with:
          ref: phase/f7-content-editorial

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare temporary lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies with npm ci
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install temporary validation runtimes
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @typescript/native-preview@7.0.0-dev.20260707.2 @playwright/test@1.54.2
          npx playwright install chromium

      - name: Correct F7 not-found heading hierarchy
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_empty_state(path: Path, title: str, replacement: str) -> None:
              text = path.read_text()
              if f'<h1 className="text-display-3 text-bone">{title}</h1>' in text:
                  return

              marker_index = text.index(f'title="{title}"')
              start = text.rfind("<EmptyState", 0, marker_index)
              end = text.index("/>", marker_index) + 2
              if start < 0:
                  raise RuntimeError(f"EmptyState start not found in {path}")

              line_start = text.rfind("\n", 0, start) + 1
              indent = text[line_start:start]
              rendered = "\n".join(indent + line for line in replacement.splitlines())
              path.write_text(text[:line_start] + rendered + text[end:])

          replace_empty_state(
              Path("src/routes/collections.$slug.tsx"),
              "این کالکشن پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute"><Layers3 aria-hidden="true" size={34} /></span>
  <h1 className="text-display-3 text-bone">این کالکشن پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">آدرس کالکشن معتبر نیست یا این صفحه دیگر در فهرست کالکشن‌های LBB قرار ندارد.</p>
  <Link to="/collections" className={CtaClasses("signal")}>بازگشت به کالکشن‌ها</Link>
</div>''',
          )

          journal_path = Path("src/routes/journal.$slug.tsx")
          replace_empty_state(
              journal_path,
              "این مقاله پیدا نشد",
              '''<div className="flex flex-col items-center gap-4 border border-hairline bg-carbon px-6 py-20 text-center">
  <span className="text-mute"><BookOpenText aria-hidden="true" size={34} /></span>
  <h1 className="text-display-3 text-bone">این مقاله پیدا نشد</h1>
  <p className="max-w-[42ch] text-sm leading-7 text-metal">آدرس مقاله معتبر نیست یا این مطلب دیگر در فهرست ژورنال قرار ندارد.</p>
  <Link to="/journal" className={CtaClasses("signal")}>بازگشت به ژورنال</Link>
</div>''',
          )
          journal_path.write_text(journal_path.read_text().replace("  EmptyState,\n", ""))
          PY

      - name: Format F7-owned files
        run: |
          npx prettier --write \
            src/routes/collections.index.tsx \
            'src/routes/collections.$slug.tsx' \
            src/routes/lookbook.tsx \
            src/routes/journal.index.tsx \
            'src/routes/journal.$slug.tsx' \
            src/routes/about.tsx \
            src/routes/faq.tsx \
            src/lib/collections.ts \
            src/lib/journal.ts

      - name: Commit scoped F7 changes
        run: |
          if git diff --quiet -- src/routes src/lib/collections.ts src/lib/journal.ts; then
            echo "No scoped changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/routes/collections.index.tsx \
              'src/routes/collections.$slug.tsx' \
              src/routes/lookbook.tsx \
              src/routes/journal.index.tsx \
              'src/routes/journal.$slug.tsx' \
              src/routes/about.tsx \
              src/routes/faq.tsx \
              src/lib/collections.ts \
              src/lib/journal.ts
            git commit -m "F7: finalize owned content pages"
            git push origin HEAD:phase/f7-content-editorial
          fi

      - name: Typecheck and enforce F7 ownership
        id: typecheck
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          repo_code=${PIPESTATUS[0]}
          set -e
          echo "repository_exit_code=$repo_code" >> "$GITHUB_OUTPUT"
          if grep -E 'src/(routes/(collections\.index|collections\.\$slug|lookbook|journal\.index|journal\.\$slug|about|faq)\.tsx|lib/(collections|journal)\.ts)' /tmp/typecheck.log; then
            echo "Type errors remain inside F7 ownership."
            exit 1
          fi
          echo "F7-owned TypeScript files are clean."

      - name: Lint F7-owned files
        run: |
          npx eslint \
            src/routes/collections.index.tsx \
            'src/routes/collections.$slug.tsx' \
            src/routes/lookbook.tsx \
            src/routes/journal.index.tsx \
            'src/routes/journal.$slug.tsx' \
            src/routes/about.tsx \
            src/routes/faq.tsx \
            src/lib/collections.ts \
            src/lib/journal.ts

      - name: Record repository lint result
        id: full_lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start validation server
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/lbb-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/collections > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lbb-server.log
          exit 1

      - name: Run complete F7 browser suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test f7-final-smoke.spec.mjs --reporter=line --workers=1

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-final-responsive-screenshots
          path: f7-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Report repository-wide blockers
        if: always()
        run: |
          echo "Repository typecheck exit code: ${{ steps.typecheck.outputs.repository_exit_code }}"
          echo "Full repository lint outcome: ${{ steps.full_lint.outcome }}"
