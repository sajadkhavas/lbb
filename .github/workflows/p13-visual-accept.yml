name: P1.3 Reviewed Visual Acceptance

on:
  push:
    branches:
      - phase/p1-3-seo-semantic-content-polish

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/p1-3-seo-semantic-content-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate reviewed category snapshot only
        run: >-
          npx playwright test tests/catalog-visual.spec.ts
          --grep "F14 category desktop visual contract"
          --update-snapshots
      - name: Verify snapshot-only mutation
        shell: bash
        run: |
          EXPECTED='tests/catalog-visual.spec.ts-snapshots/f14-category-desktop-chromium-linux.png'
          CHANGED="$(git diff --name-only)"
          printf 'CHANGED=%s\n' "$CHANGED"
          [[ "$CHANGED" == "$EXPECTED" ]]
      - name: Commit reviewed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-visual.spec.ts-snapshots/f14-category-desktop-chromium-linux.png
          git commit -m "test(seo): accept reviewed category visual baseline"
          git push origin HEAD:phase/p1-3-seo-semantic-content-polish
